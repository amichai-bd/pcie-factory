[pytest]
# Run from the repository root: python3 -m pytest tools
# Test file basenames must be unique across tools/ (default "prepend" import mode).
pythonpath = .
addopts = -p no:cacheprovider
testpaths = .
norecursedirs = fixtures theme __pycache__
markers =
    vocabulary: builds the RTL vocabulary headers with Verilator (cfg/ci.yaml vocabulary_tests)
