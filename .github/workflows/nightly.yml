# Nightly L2 with coverage, metrics and the guarded data PR. Owning docs: wiki/bkm/devops.md
# (Nightly, Metrics) and wiki/tools/metrics/SPEC.md (Workflows).
#
# Three jobs, each with only the token permissions it needs:
#   nightly  read-only: checks, unit suites (arch perf included), L0+L1+L2 with coverage,
#            FPGA flow, ASIC synthesis-only check, full ASIC flow (unless ASIC_PAUSED),
#            metrics files, trend drop alerts in the job summary
#   publish  contents/pull-requests/actions write: commits ONLY the data files
#            (commits.jsonl and this run's <date>T<HHMMSS>Z.json record) on
#            nightly/<date>, opens the type:data PR, dispatches ci-gate on it
#   report   issues write, actions read: opens/updates/closes the single nightly-red issue,
#            naming the failed steps, the commits since the last green nightly and
#            each failed regression run with its exact seed (rotated extra seeds marked)
# No pull_request trigger, so fork code never reaches this workflow.
name: nightly

on:
  schedule:
    - cron: "17 3 * * *"   # 03:17 UTC daily, off-peak
  workflow_dispatch:
    inputs:
      base:
        description: "Base branch of the data PR. Only main enables auto-merge and the nightly-red issue; another branch is for testing this workflow."
        type: string
        default: main

permissions: {}

concurrency:
  group: nightly
  cancel-in-progress: false

env:
  BASE: ${{ inputs.base || 'main' }}
  # The ASIC pause switch, the only one (wiki/bkm/devops.md#asic-pause):
  # "true" skips the full ASIC flow step (place and route, timing), recorded
  # as `asic=paused`, with no ASIC numbers in tonight's record. Set by captain
  # decision (2026-10-19, #362, unstable host); "false" resumes it. The ASIC
  # synthesis-only check (step asic-synth) runs every night either way.
  ASIC_PAUSED: "true"

jobs:
  # Every job runs only on the WSL host's runners (label wsl), never on the
  # Omarchy runners (wiki/bkm/devops.md, Nightly).
  nightly:
    runs-on: [self-hosted, linux, x64, wsl]
    timeout-minutes: 480
    permissions:
      contents: read
      issues: read
      pull-requests: read
      actions: read
    outputs:
      date: ${{ steps.prep.outputs.date }}
      collected: ${{ steps.collect.outcome == 'success' }}
      # Step results, so the report names the failed ones (regress: full L2, coverage floors).
      check: ${{ steps.check.outputs.result || 'fail' }}
      unit: ${{ steps.unit.outputs.result || 'fail' }}
      regress: ${{ steps.regress.outputs.result || 'fail' }}
      fpga: ${{ steps.fpga.outputs.result || 'fail' }}
      asic_synth: ${{ steps.asic_synth.outputs.result || 'fail' }}
      asic: ${{ steps.asic.outputs.result || 'fail' }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0          # full first-parent history for the commit series
          persist-credentials: false

      - name: Prepare
        id: prep
        run: |
          case "$BASE" in (*[!A-Za-z0-9._/-]*|"") echo "::error::invalid base branch"; exit 1;; esac
          echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"
          echo "started=$(date -u +%FT%TZ)" >> "$GITHUB_OUTPUT"
          mkdir -p workdir/nightly
          # run_step NAME CMD...: run CMD with its output logged; record
          # result=pass|fail|skipped (skipped: the subcommand is still a stub).
          # pause_step records result=paused (a step its pause switch turned off).
          cat > workdir/nightly/lib.sh <<'EOF'
          run_step() {
            local name="$1"; shift
            local log="workdir/nightly/$name.log" code
            set +e; "$@" 2>&1 | tee "$log"; code=${PIPESTATUS[0]}; set -e
            if [ "$code" -eq 2 ] && grep -q 'not implemented yet' "$log"; then
              echo "::notice::$name: not implemented on this commit; skipped"
              echo "result=skipped" >> "$GITHUB_OUTPUT"; return 0
            fi
            [ "$code" -eq 0 ] && echo "result=pass" >> "$GITHUB_OUTPUT" || echo "result=fail" >> "$GITHUB_OUTPUT"
            return "$code"
          }
          skip_step() { echo "::notice::$1"; echo "result=skipped" >> "$GITHUB_OUTPUT"; }
          pause_step() { echo "::notice::$1"; echo "result=paused" >> "$GITHUB_OUTPUT"; }
          EOF
          git log --oneline -1

      - name: Python dependencies
        run: |
          if python3 -m pip install --dry-run --no-index --quiet -r tools/requirements.txt >/dev/null 2>&1; then
            echo "runner Python satisfies tools/requirements.txt"
          else
            python3 -m venv workdir/venv
            workdir/venv/bin/pip install --quiet -r tools/requirements.txt
            echo "$PWD/workdir/venv/bin" >> "$GITHUB_PATH"
          fi

      - name: Static checks
        id: check
        run: |
          . workdir/nightly/lib.sh
          run_step check ./build check

      # The only place the nightly runs the architecture-model perf
      # scenarios: `ci unit` holds a perf:<ip> suite (./build arch --ip <ip>)
      # for every IP with src/arch/<ip>/perf/, writing workdir/<ip>/arch/perf.json
      # for the metrics arch section. There is no separate arch step.
      - name: Unit tests (every suite, the Verilator-built vocabulary tests and arch perf included)
        id: unit
        if: ${{ !cancelled() }}
        run: |
          . workdir/nightly/lib.sh
          run_step unit ./build ci unit

      # --rotate: extra seeds per L2 entry derived from tonight's date, on
      # plain builds within the rotation CPU budget of cfg/levels.yaml
      # (wiki/tools/regress/SPEC.md#seed-rotation); a failing one fails regress.
      - name: Regression L0+L1+L2 with coverage (all IPs) and rotated extra seeds
        id: regress
        if: ${{ !cancelled() }}
        env:
          ROTATE: ${{ steps.prep.outputs.date }}
        run: |
          . workdir/nightly/lib.sh
          run_step regress ./build regress --level 0 --level 1 --level 2 --jobs "$(nproc)" --coverage --rotate "$ROTATE"

      - name: FPGA flow (IPs with src/fpga/<ip>/)
        id: fpga
        if: ${{ !cancelled() }}
        run: |
          . workdir/nightly/lib.sh
          if ! find src/fpga -mindepth 1 -maxdepth 1 -type d -not -name '.*' 2>/dev/null | grep -q .; then skip_step "fpga: no IP has fpga/<ip>/ inputs"
          elif ./build fpga --help 2>/dev/null | grep -q -- '--all'; then run_step fpga ./build fpga --all
          else skip_step "fpga: ./build fpga --all is not available on this commit"; fi

      # ASIC synthesis is an L2 check (captain decision, 2026-10-19, #362):
      # the synthesis-only compatibility check of every IP with src/asic/<ip>/,
      # the same command PR CI ran before; a failure fails the nightly.
      - name: ASIC synthesis check (IPs with src/asic/<ip>/)
        id: asic_synth
        if: ${{ !cancelled() }}
        run: |
          . workdir/nightly/lib.sh
          run_step asic-synth ./build ci vendor --kind asic

      - name: ASIC flow (IPs with src/asic/<ip>/)
        id: asic
        if: ${{ !cancelled() }}
        run: |
          . workdir/nightly/lib.sh
          ips=$(find src/asic -mindepth 1 -maxdepth 1 -type d -not -name '.*' -printf '%f\n' 2>/dev/null | sort)
          help=$(./build asic --help 2>/dev/null || true)
          if [ "$ASIC_PAUSED" = true ]; then pause_step "asic: paused by ASIC_PAUSED (wiki/bkm/devops.md#asic-pause)"
          elif [ -z "$ips" ]; then skip_step "asic: no IP has asic/<ip>/ inputs"
          elif grep -q -- '--all' <<<"$help"; then run_step asic ./build asic --all
          elif grep -q -- '--ip' <<<"$help"; then
            run_step asic bash -c 'rc=0; for ip in "$@"; do ./build asic --ip "$ip" || rc=1; done; exit $rc' _ $ips
          else skip_step "asic: ./build asic is not available on this commit"; fi

      - name: Metrics
        id: collect
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STARTED: ${{ steps.prep.outputs.started }}
        run: |
          out=workdir/nightly-data
          mkdir -p "$out"
          # Continue the base branch's series (the first run backfills it).
          git show "origin/$BASE:wiki/tracker/data/commits.jsonl" > "$out/commits.jsonl" 2>/dev/null || rm -f "$out/commits.jsonl"
          ./build metrics commits --ref origin/main --file "$out/commits.jsonl"
          # One record per run, named by its start (<date>T<HHMMSS>Z.json), so a
          # same-day rerun never overwrites an earlier run's record.
          ./build metrics collect --out-dir "$out" --started "$STARTED" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --step "check=${{ steps.check.outputs.result || 'fail' }}" \
            --step "unit=${{ steps.unit.outputs.result || 'fail' }}" \
            --step "regress=${{ steps.regress.outputs.result || 'fail' }}" \
            --step "fpga=${{ steps.fpga.outputs.result || 'fail' }}" \
            --step "asic-synth=${{ steps.asic_synth.outputs.result || 'fail' }}" \
            --step "asic=${{ steps.asic.outputs.result || 'fail' }}"

      # Per-IP drop alerts of tonight's record against the committed history
      # (wiki/tools/metrics/SPEC.md#trends), in the job summary.
      - name: Trend drop alerts
        if: ${{ !cancelled() && steps.collect.outcome == 'success' }}
        run: |
          set -o pipefail
          ./build metrics trends --dir wiki/tracker/data --dir workdir/nightly-data | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload data files
        if: ${{ !cancelled() && steps.collect.outcome == 'success' }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: nightly-data
          path: workdir/nightly-data/
          if-no-files-found: error
          retention-days: 14

      - name: Upload ASIC synthesis summary
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: asic-synth-summary
          path: |
            workdir/*/asic-synth/synthesis.json
            workdir/ci/vendor-asic.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload regression summary
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: regress-summary
          path: workdir/regress/summary.json
          if-no-files-found: warn
          retention-days: 14

  publish:
    needs: nightly
    if: ${{ !cancelled() && needs.nightly.outputs.collected == 'true' }}
    runs-on: [self-hosted, linux, x64, wsl]
    timeout-minutes: 15
    permissions:
      contents: write        # push nightly/<date>
      pull-requests: write   # open and label the data PR, enable auto-merge
      actions: write         # dispatch ci-gate on the data branch and pages on main
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          # No credential on disk: the package install below never sees the
          # write token, and the push passes it explicitly.
          persist-credentials: false

      - name: Python dependencies
        run: |
          python3 -m venv workdir/venv
          workdir/venv/bin/pip install --quiet "$(grep '^PyYAML==' tools/requirements.txt)"
          echo "$PWD/workdir/venv/bin" >> "$GITHUB_PATH"

      - uses: actions/download-artifact@v8.0.1
        with:
          name: nightly-data
          path: workdir/nightly-data

      - name: Commit the data files on nightly/<date> and open the data PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DATE: ${{ needs.nightly.outputs.date }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          case "$BASE" in (*[!A-Za-z0-9._/-]*|"") echo "::error::invalid base branch"; exit 1;; esac
          # A test dispatch against another base gets its own branch, so it
          # never force-pushes over the day's real data PR head.
          if [ "$BASE" = main ]; then branch="nightly/$DATE"; else branch="nightly/$DATE-${BASE//\//-}"; fi
          data_dir=$(python3 -c 'import yaml; print(yaml.safe_load(open("cfg/metrics.yaml"))["data_dir"])')
          git fetch --quiet origin "$BASE"
          git worktree prune
          git worktree add --quiet -B "$branch" workdir/data-branch "origin/$BASE"
          mkdir -p "workdir/data-branch/$data_dir"
          cp workdir/nightly-data/* "workdir/data-branch/$data_dir/"
          git -C workdir/data-branch add -- "$data_dir"
          if git -C workdir/data-branch diff --cached --quiet; then
            echo "no data change against $BASE; nothing to publish"; exit 0
          fi
          # Data-only commits use the GitHub Actions bot identity.
          git -C workdir/data-branch -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit --quiet -m "nightly: metrics for $DATE"
          # The ci-gate data guard, run here from this trusted checkout.
          ./build metrics guard --branch "$branch" --base "origin/$BASE" --head "$branch"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            push --force origin "refs/heads/$branch:refs/heads/$branch"

          # Older data PRs would conflict on commits.jsonl: close them.
          gh api "repos/$REPO/pulls?state=open&base=$BASE&per_page=100" \
            --jq '.[] | select(.head.ref | startswith("nightly/")) | "\(.number) \(.head.ref)"' |
          while read -r old ref; do
            [ "$ref" = "$branch" ] && continue
            gh api --silent -X POST "repos/$REPO/issues/$old/comments" -f body="Superseded by the data PR for $DATE ($branch); closing."
            gh api --silent -X PATCH "repos/$REPO/pulls/$old" -f state=closed
            echo "closed superseded data PR #$old ($ref)"
          done

          number=$(gh api "repos/$REPO/pulls?head=$OWNER:$branch&state=open" --jq '.[0].number // empty')
          if [ -z "$number" ]; then
            body="Nightly metrics for $DATE: changes only \`$data_dir/**\`. Opened by the nightly workflow under the data-PR exception in CLAUDE.md; no issue or reviewer. Run: $GITHUB_SERVER_URL/$REPO/actions/runs/$GITHUB_RUN_ID"
            if ! number=$(gh api -X POST "repos/$REPO/pulls" -f title="nightly: metrics for $DATE" \
                -f head="$branch" -f base="$BASE" -f body="$body" --jq .number 2>workdir/pr-error.txt); then
              cat workdir/pr-error.txt
              if grep -q 'not permitted to create' workdir/pr-error.txt; then
                echo "::error::GITHUB_TOKEN may not open pull requests. Enable Settings > Actions > General > 'Allow GitHub Actions to create and approve pull requests'. Branch $branch is pushed: $GITHUB_SERVER_URL/$REPO/compare/$BASE...$branch"
              fi
              exit 1
            fi
          fi
          gh api --silent -X POST "repos/$REPO/issues/$number/labels" -f 'labels[]=type:data' -f 'labels[]=area:wiki'
          echo "data PR: $GITHUB_SERVER_URL/$REPO/pull/$number"

          # Pushes and PRs made with GITHUB_TOKEN start no runnable workflows
          # (pull_request runs wait for approval), so run ci-gate (which holds
          # the data guard) by dispatch on the branch. Protection does not
          # count that dispatched check run; the run's ci-gate-status job posts
          # the gate's result as the `ci-gate` commit status on the PR head,
          # which it does count (wiki/tools/metrics/SPEC.md#workflows).
          gh api --silent -X POST "repos/$REPO/actions/workflows/ci.yml/dispatches" -f ref="$branch"
          echo "dispatched ci.yml on $branch"

          if [ "$BASE" = main ]; then
            # Auto-merge (squash) once the required checks pass. GitHub has no
            # REST call for this; gh uses GraphQL, which works with GITHUB_TOKEN.
            gh pr merge --repo "$REPO" --auto --squash "$number" \
              || echo "::warning::auto-merge not enabled on #$number (repository 'Allow auto-merge' off or no required checks on main); the PR waits for a maintainer"
            # Republish the site. This may run before the merge lands (a merge
            # by GitHub Actions starts no workflows); pages.yml's daily
            # schedule is the backstop.
            gh api --silent -X POST "repos/$REPO/actions/workflows/pages.yml/dispatches" -f ref=main
          fi

  report:
    needs: [nightly, publish]
    # Test dispatches against another base never touch the nightly-red issue.
    if: ${{ !cancelled() && (github.event_name == 'schedule' || inputs.base == 'main') }}
    runs-on: [self-hosted, linux, x64, wsl]
    timeout-minutes: 5
    permissions:
      contents: read         # compare the last green nightly's commit with this one
      actions: read          # find the last green nightly run
      issues: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Python dependencies
        run: |
          python3 -m venv workdir/venv
          workdir/venv/bin/pip install --quiet "$(grep '^PyYAML==' tools/requirements.txt)"
      # The failed runs, each with its exact seed, come from this summary;
      # it is missing when regress never ran (red then says so).
      - uses: actions/download-artifact@v8.0.1
        continue-on-error: true
        with:
          name: regress-summary
          path: workdir/regress
      - name: Open, update or close the nightly-red issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUTCOME: ${{ needs.nightly.result == 'success' && needs.publish.result == 'success' && 'success' || 'failure' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
          STEPS: >-
            check=${{ needs.nightly.outputs.check || 'fail' }}
            unit=${{ needs.nightly.outputs.unit || 'fail' }}
            regress=${{ needs.nightly.outputs.regress || 'fail' }}
            fpga=${{ needs.nightly.outputs.fpga || 'fail' }}
            asic-synth=${{ needs.nightly.outputs.asic_synth || 'fail' }}
            asic=${{ needs.nightly.outputs.asic || 'fail' }}
        # A failure names the failed steps, the commits since the last green
        # nightly and each failed run with its exact seed (wiki/tools/metrics/SPEC.md#red).
        run: |
          args=(--summary workdir/regress/summary.json)
          for s in $STEPS; do args+=(--step "$s"); done
          workdir/venv/bin/python -B ./build metrics red --outcome "$OUTCOME" --run-url "$RUN_URL" \
            --head "$HEAD_SHA" "${args[@]}"
