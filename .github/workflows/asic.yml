# ASIC flow (ORFS); see wiki/tools/asic/SPEC.md and wiki/bkm/pd.md.
# Full flow on demand; nightly calls it directly. CI uses only --synth-only.
# Runs on the
# self-hosted host that has ORFS and uploads only metrics.json and the
# worst-path summary, never raw ORFS reports or logs.
name: asic

on:
  workflow_dispatch:
    inputs:
      ip:
        description: IP id with a src/asic/<ip>/ folder (empty = every such IP)
        required: false
        default: ""
      study_clock_period:
        description: Clock study period in ns (empty = the SDC target; needs an opted-in SDC)
        required: false
        default: ""
      timeout:
        description: ORFS budget per IP in seconds (empty = the tool default, 3600)
        required: false
        default: ""

permissions:
  contents: read

jobs:
  flow:
    # Public repository: never run fork code on the self-hosted runners
    # (kept even though only workflow_dispatch triggers this workflow today).
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, wsl]
    # Covers a raised per-IP budget (timeout input) plus setup.
    timeout-minutes: 150
    concurrency:
      group: asic-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    env:
      IP: ${{ inputs.ip }}
      STUDY: ${{ inputs.study_clock_period }}
      BUDGET: ${{ inputs.timeout }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Discover ORFS
        # Tool versions and ORFS paths only (wiki/tools/asic/SPEC.md#orfs-runners).
        run: |
          set +e
          echo "ORFS_IMAGE=${ORFS_IMAGE:-<unset>}"
          docker version --format 'docker {{.Server.Version}}'
          docker images --digests --format '{{.Repository}}:{{.Tag}}@{{.Digest}}' | grep -i -E '^(openroad|orfs)'
          for tool in openroad yosys klayout; do command -v "$tool" || echo "$tool: not on PATH"; done
          exit 0
      - name: Run the ASIC flow
        run: |
          # Without an input: every IP that has a src/asic/<ip>/ folder.
          ips="$IP"
          if [ -z "$ips" ]; then
            ips=$(find src/asic -mindepth 1 -maxdepth 1 -type d -not -name '.*' -printf '%f\n' 2>/dev/null | sort)
          fi
          [ -n "$ips" ] || { echo "no IP has a src/asic/<ip>/ folder"; exit 1; }
          # A study period runs an explicit clock study (isolated output).
          study=()
          if [ -n "$STUDY" ]; then
            # A positive decimal: digits with at most one point, not all zero.
            if ! [[ "$STUDY" =~ ^([0-9]+|[0-9]*\.[0-9]+)$ && "$STUDY" =~ [1-9] ]]; then
              echo "study_clock_period must be a positive decimal number of ns"; exit 1
            fi
            study=(--study-clock-period "$STUDY")
          fi
          budget=()
          if [ -n "$BUDGET" ]; then
            case "$BUDGET" in
              *[!0-9]*) echo "timeout must be a whole number of seconds"; exit 1 ;;
            esac
            budget=(--timeout "$BUDGET")
          fi
          rc=0
          for ip in $ips; do
            ./build asic --ip "$ip" "${study[@]}" "${budget[@]}" || rc=1
          done
          exit $rc
      - name: Upload metrics and worst-path summary
        if: always()
        uses: actions/upload-artifact@v6.0.0
        with:
          name: asic-metrics
          if-no-files-found: warn
          retention-days: 14
          path: |
            workdir/**/asic/metrics.json
            workdir/**/asic/worst_path.txt
            workdir/**/asic-study/**/metrics.json
            workdir/**/asic-study/**/worst_path.txt
