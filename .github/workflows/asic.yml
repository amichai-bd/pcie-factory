# ASIC flow (ORFS) for one IP; see wiki/tools/asic/SPEC.md and wiki/bkm/pd.md.
# Runs on the self-hosted host that has ORFS; uploads metrics.json and the
# key reports. Never part of ci-gate.
name: asic

on:
  workflow_dispatch:
    inputs:
      ip:
        description: IP id with an asic/ directory (empty = every such IP)
        required: false
        default: ""
  pull_request:
    branches: [main]
    paths:
      - "tools/asic/**"
      - "src/**/asic/**"
      - "src/**/rtl/**"
      - ".github/workflows/asic.yml"

permissions:
  contents: read

jobs:
  flow:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 90
    concurrency:
      group: asic-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    env:
      IP: ${{ inputs.ip }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Discover ORFS
        run: |
          set +e
          uname -a
          echo "--- docker"; command -v docker && docker version --format '{{.Server.Version}}'
          docker images --digests 2>&1 | grep -i -E 'openroad|orfs'
          echo "--- native tools"; which openroad yosys klayout make python3
          echo "--- candidate roots"; ls -d /opt/orfs* /opt/OpenROAD* /opt/openroad* ~/OpenROAD-flow-scripts* ~/orfs* /OpenROAD-flow-scripts 2>&1
          echo "--- env"; env | grep -i -E 'orfs|openroad|flow_home' || true
          echo "--- /opt/orfs"; ls -la /opt/orfs; find /opt/orfs -maxdepth 2 -type f -size -8k -exec sh -c 'echo "== $1"; head -40 "$1"' _ {} \;
          if [ -n "$ORFS_IMAGE" ]; then
            echo "--- inside $ORFS_IMAGE"
            docker run --rm "$ORFS_IMAGE" bash -c 'pwd; ls /OpenROAD-flow-scripts /OpenROAD-flow-scripts/flow; cat /OpenROAD-flow-scripts/env.sh | head -30; command -v openroad yosys klayout; yosys -m slang -p "help read_slang" 2>&1 | head -3'
          fi
          exit 0
      - name: Run the ASIC flow
        run: |
          # Without an input: every IP that has an asic/ directory.
          ips="$IP"
          if [ -z "$ips" ]; then
            ips=$(find src -type d -name asic -printf '%P\n' | sed 's|/asic$||' | sort)
          fi
          [ -n "$ips" ] || { echo "no IP has an asic/ directory"; exit 1; }
          rc=0
          for ip in $ips; do
            ./build asic --ip "$ip" || rc=1
          done
          exit $rc
      - name: Upload metrics and reports
        if: always()
        uses: actions/upload-artifact@v6.0.0
        with:
          name: asic-metrics
          if-no-files-found: warn
          path: |
            workdir/**/asic/metrics.json
            workdir/**/asic/flow.log
            workdir/**/asic/run/reports/**
            workdir/**/asic/run/logs/**/*.json
            workdir/**/asic/run/logs/**/*.log
