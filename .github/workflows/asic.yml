# ASIC flow (ORFS) for one IP; see wiki/tools/asic/SPEC.md and wiki/bkm/pd.md.
# Runs on the self-hosted host that has ORFS; uploads metrics.json and the
# key reports. Never part of ci-gate.
name: asic

on:
  workflow_dispatch:
    inputs:
      ip:
        description: IP id with an asic/ directory (empty = every such IP)
        required: false
        default: ""
  pull_request:
    branches: [main]
    paths:
      - "tools/asic/**"
      - "src/**/asic/**"
      - "src/**/rtl/**"
      - ".github/workflows/asic.yml"

permissions:
  contents: read

jobs:
  flow:
    # Public repository: never run fork code on the self-hosted runners.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 90
    concurrency:
      group: asic-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    env:
      IP: ${{ inputs.ip }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Discover ORFS
        # Informational: what this host offers (see wiki/tools/asic/SPEC.md#orfs-runners).
        run: |
          set +e
          echo "ORFS_IMAGE=${ORFS_IMAGE:-<unset>} ORFS_ROOT=${ORFS_ROOT:-<unset>}"
          docker version --format 'docker {{.Server.Version}}'
          docker images --digests | grep -i -E 'openroad|orfs'
          which openroad yosys klayout
          ls -d /opt/orfs* /opt/OpenROAD* ~/OpenROAD-flow-scripts* 2>/dev/null
          exit 0
      - name: Run the ASIC flow
        run: |
          # Without an input: every IP that has an asic/ directory.
          ips="$IP"
          if [ -z "$ips" ]; then
            ips=$(find src -type d -name asic -printf '%P\n' | sed 's|/asic$||' | sort)
          fi
          [ -n "$ips" ] || { echo "no IP has an asic/ directory"; exit 1; }
          rc=0
          for ip in $ips; do
            ./build asic --ip "$ip" || rc=1
          done
          exit $rc
      - name: Upload metrics and reports
        if: always()
        uses: actions/upload-artifact@v6.0.0
        with:
          name: asic-metrics
          if-no-files-found: warn
          path: |
            workdir/**/asic/metrics.json
            workdir/**/asic/flow.log
            workdir/**/asic/run/reports/**
            workdir/**/asic/run/logs/**/*.json
            workdir/**/asic/run/logs/**/*.log
