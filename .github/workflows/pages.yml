# Wiki site; see wiki/tools/wiki_site/SPEC.md.
# The repository and the published site are public.
# A pull request builds with --strict and never deploys; a push to main or a
# manual dispatch or the daily schedule builds strictly and deploys to GitHub Pages.
name: pages

on:
  pull_request:
    branches: [main]
    paths:
      - "wiki/**"
      - "README.md"
      - "CLAUDE.md"
      - ".claude/skills/**"
      - "tools/wiki_site/**"
      - "tools/requirements.txt"
      - ".github/workflows/pages.yml"
  push:
    branches: [main]
  # Backstop for nightly data merged by GitHub Actions auto-merge, whose push
  # to main starts no workflows; about 2 hours after the 03:17 UTC nightly.
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # Public repository: never run fork PR code on the self-hosted runners.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 10
    # Only the build is cancellable (wiki/tools/wiki_site/SPEC.md#publishing):
    # a new PR head or push to main cancels the superseded build; a cancelled
    # build skips its deploy. Dispatch (the nightly's republish) and schedule
    # get a group of their own run, so a push never cancels them.
    concurrency:
      group: pages-build-${{ github.event.pull_request.number || (github.event_name == 'push' && github.ref) || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Install the generator's Python dependencies
        run: |
          python3 -m venv workdir/venv
          workdir/venv/bin/pip install --quiet -r tools/requirements.txt
      - name: Build the site strictly
        run: workdir/venv/bin/python -B tools/wiki_site/wiki_site.py build --strict --sha "$GITHUB_SHA" --out workdir/wiki-site
      - name: Upload the Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: workdir/wiki-site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    # One deploy at a time and never cancelled mid-run: deploy-pages cancels
    # its own deployment if its job is cancelled, which would leave the site
    # on the previous version until the next run.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
