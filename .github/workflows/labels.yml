# Label sync; see wiki/tools/labels/SPEC.md.
# A push to main that changes the label config, the tool, or src/ (ip: labels
# are derived from IP discovery) makes the repository labels match the config.
# It never prunes; run `./build labels sync --prune` by hand for that.
# Runner prerequisites: python3 and the GitHub CLI `gh` on PATH.
name: labels

on:
  push:
    branches: [main]
    paths:
      - "cfg/labels.yaml"
      - "tools/labels/**"
      - "tools/build/ip.py"
      - "tools/build/filelist.py"
      - "tools/cli/**"
      - "src/**"
      - ".github/workflows/labels.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: labels
  cancel-in-progress: false

jobs:
  sync:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Check that the GitHub CLI is installed
        run: |
          command -v gh >/dev/null || { echo "::error::gh (GitHub CLI) is not installed on this runner; ./build labels needs it"; exit 1; }
          gh --version
      - name: Install the tool's Python dependencies
        run: |
          python3 -m venv workdir/venv
          workdir/venv/bin/pip install --quiet "$(grep '^PyYAML==' tools/requirements.txt)"
      - name: Sync labels
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: workdir/venv/bin/python -B ./build labels sync --repo "$GITHUB_REPOSITORY"
