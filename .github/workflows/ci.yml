# ci-gate: the single required check. Owning docs: wiki/bkm/devops.md
# (continuous integration) and wiki/tools/ci/SPEC.md (also the ci-gate-status
# job for nightly data branches). Selection rules live in
# cfg/ci.yaml and the tools, never here: this file only chooses between
# "affected since the PR base" (pull_request) and "everything" (push, dispatch).
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read   # data guard: the base of a dispatched branch's open PR

concurrency:
  # One group per PR, so a new head cancels the superseded run. Pushes and
  # dispatches get a group of their own run, so every push to main keeps its run.
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci-gate:
    # Fork guard; the rule is in wiki/bkm/devops.md (Forks). This `if:` lives
    # in the PR's own copy of this file, so a fork can delete it: defense in
    # depth only. Maintainers NEVER approve a fork PR's workflow run; fork
    # changes reach CI only by review and re-push to a branch here (a skipped
    # required check counts as passing). Never use pull_request_target with a
    # PR checkout.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64]
    # Target (not enforced): checks plus L0+L1 of the affected IPs within
    # 10 minutes; the hard timeout leaves headroom for a cold dependency install.
    timeout-minutes: 20
    env:
      # pull_request checks out the merge commit refs/pull/N/merge, whose first
      # parent is the base branch tip it was merged onto. HEAD^1 therefore
      # diffs exactly the PR's change against the tree being tested, even if
      # main moved after the event (base.sha could be older and over-select).
      # fetch-depth 2 is enough: HEAD^1 is a parent of HEAD, so it is the merge base.
      AFFECTED: ${{ github.event_name == 'pull_request' && '--affected HEAD^1' || '' }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Toolchain
        run: |
          git log --oneline -3
          echo "python3: $(command -v python3) ($(python3 --version 2>&1)); VIRTUAL_ENV=${VIRTUAL_ENV:-unset}"
          prefix=$(python3 -c 'import yaml; print(yaml.safe_load(open("cfg/host.yaml"))["verilator"]["prefix"])' 2>/dev/null || true)
          echo "cfg/host.yaml verilator prefix: ${prefix:-unreadable} ($( [ -x "$prefix/bin/verilator" ] && echo present || echo absent))"
          if command -v verilator >/dev/null; then
            echo "verilator: $(command -v verilator) ($(verilator --version))"
          elif [ -x "$prefix/bin/verilator" ]; then
            echo "verilator: $prefix/bin/verilator ($("$prefix/bin/verilator" --version))"
          else
            echo "::error::verilator not found on PATH or under the cfg/host.yaml prefix"
            exit 1
          fi
          python3 -c 'import cocotb; print("cocotb", cocotb.__version__)' || echo "cocotb: not importable by python3"

      - name: Python dependencies
        run: |
          # Use the runner's environment when it already has every pin in
          # tools/requirements.txt (checked offline); otherwise install them
          # into a job venv and put it first on PATH for the later steps.
          if python3 -m pip install --dry-run --no-index --quiet -r tools/requirements.txt >/dev/null 2>&1; then
            echo "runner Python satisfies tools/requirements.txt"
          else
            echo "runner Python lacks some pins; installing them into workdir/venv"
            python3 -m venv workdir/venv
            workdir/venv/bin/pip install --quiet -r tools/requirements.txt
            echo "$PWD/workdir/venv/bin" >> "$GITHUB_PATH"
          fi

      - name: Data guard
        id: guard
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_BRANCH: ${{ github.head_ref }}
        run: |
          # A nightly/ branch may change only the data directory
          # (wiki/tools/metrics/SPEC.md#guard); other branches pass at once.
          # A pull request compares its merge commit with the first parent. A
          # dispatch on a nightly/ ref (the nightly's data PR is opened with
          # GITHUB_TOKEN, so it gets no runnable pull_request run and is
          # dispatched instead; push triggers only on main) compares with the
          # base of the branch's open PR into main, else of any open PR, else
          # main. Other pushes and dispatches stop here.
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            ./build metrics guard --branch "$PR_BRANCH" --base HEAD^1
            exit 0
          fi
          case "$GITHUB_REF_NAME" in
            nightly/*) ;;
            *) echo "$GITHUB_REF_NAME: not a nightly/ branch; nothing to guard"; exit 0 ;;
          esac
          base=$(gh api "repos/$GITHUB_REPOSITORY/pulls?head=$GITHUB_REPOSITORY_OWNER:$GITHUB_REF_NAME&state=open" \
            --jq '([.[] | select(.base.ref == "main")] + .)[0].base.ref // "main"')
          git fetch --quiet --unshallow origin 2>/dev/null || true
          git fetch --quiet origin "$base"
          ./build metrics guard --branch "$GITHUB_REF_NAME" --base "origin/$base"

      - name: Static checks
        id: check
        if: ${{ !cancelled() }}
        run: ./build check

      - name: Unit tests (tools, models)
        id: unit
        if: ${{ !cancelled() }}
        run: ./build ci unit $AFFECTED

      - name: Regression L0+L1
        id: regress
        if: ${{ !cancelled() }}
        run: ./build regress --level 0 --level 1 $AFFECTED --jobs "$(nproc)"

      - name: Job summary
        if: ${{ !cancelled() }}
        env:
          GUARD: ${{ steps.guard.outcome }}
          CHECK: ${{ steps.check.outcome }}
          UNIT: ${{ steps.unit.outcome }}
          REGRESS: ${{ steps.regress.outcome }}
        run: |
          {
            echo "## ci-gate (${GITHUB_EVENT_NAME}${AFFECTED:+, $AFFECTED})"
            echo
            echo "| Step | Outcome |"
            echo "| --- | --- |"
            echo "| \`./build metrics guard\` | $GUARD |"
            echo "| \`./build check\` | $CHECK |"
            echo "| \`./build ci unit\` | $UNIT |"
            echo "| \`./build regress\` | $REGRESS |"
            echo
            ./build ci summary
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload regression summary
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: regress-summary
          path: workdir/regress/summary.json
          if-no-files-found: warn
          retention-days: 14

  # The data PR is opened with GITHUB_TOKEN, so its ci-gate runs by dispatch,
  # and branch protection does not count a dispatched check run toward a PR.
  # This job mirrors the gate's own result as a `ci-gate` commit status on the
  # tested commit, which protection does accept from GitHub Actions
  # (wiki/tools/ci/SPEC.md#build-ci-status). It is the only place with
  # statuses: write; it runs only for a dispatch on a nightly/ ref (push
  # triggers only on main; never for a pull_request, so never for a fork),
  # after the gate finishes, and its state comes from needs.ci-gate.result
  # alone. The status binds to the commit, not to a PR or its base.
  ci-gate-status:
    needs: ci-gate
    if: ${{ always() && github.event_name != 'pull_request' && startsWith(github.ref, 'refs/heads/nightly/') }}
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Python dependencies
        run: |
          if python3 -m pip install --dry-run --no-index --quiet -r tools/requirements.txt >/dev/null 2>&1; then
            echo "runner Python satisfies tools/requirements.txt"
          else
            python3 -m venv workdir/venv
            workdir/venv/bin/pip install --quiet -r tools/requirements.txt
            echo "$PWD/workdir/venv/bin" >> "$GITHUB_PATH"
          fi

      - name: Post the ci-gate commit status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESULT: ${{ needs.ci-gate.result }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: ./build ci status --result "$RESULT" --sha "$GITHUB_SHA" --ref "$GITHUB_REF" --target-url "$TARGET_URL"
