# Disposable #435 evidence experiment, never merge. wiki/tools/build/SPEC.md
name: isolated compiler optimization evidence
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: isolated-compiler-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  compiler-evidence:
    runs-on: [self-hosted, linux, x64, wsl]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Verify exact benchmark source and host capacity
        env:
          SOURCE_SHA: 8d54b623d9919da08812d0df771fb0a98bd70308
        run: |
          set -eu
          test "$(git rev-parse HEAD^)" = "$SOURCE_SHA"
          test -z "$(git diff "$SOURCE_SHA" HEAD -- tools cfg src ':!src/dv/opt_probe.py')"
          mkdir -p workdir/opt-evidence
          git rev-parse HEAD > workdir/opt-evidence/probe-head.txt
          printf '%s\n' "$SOURCE_SHA" > workdir/opt-evidence/source-head.txt
          nproc > workdir/opt-evidence/nproc.txt
          lscpu > workdir/opt-evidence/lscpu.txt
          free -b > workdir/opt-evidence/memory-start.txt
          cat /proc/loadavg > workdir/opt-evidence/load-start.txt
          ps -eo pid,ppid,comm,pcpu,pmem --sort=-pcpu | head -30 > workdir/opt-evidence/processes-start.txt
      - name: Dependencies
        run: |
          if python3 -m pip install --dry-run --no-index --quiet -r tools/requirements.txt >/dev/null 2>&1; then
            echo "runner dependencies satisfied"
          else
            python3 -m venv workdir/venv
            workdir/venv/bin/pip install --quiet -r tools/requirements.txt
            echo "$PWD/workdir/venv/bin" >> "$GITHUB_PATH"
          fi
      - name: Paired benchmark using unchanged test entries
        env:
          BUILD_CACHE: ${{ runner.temp }}/opt-probe-${{ github.run_id }}
        run: |
          set -o pipefail
          mkdir -p workdir/opt-evidence
          git log --oneline -2 > workdir/opt-evidence/source-history.txt
          verilator --version | tee workdir/opt-evidence/verilator.txt
          g++ --version > workdir/opt-evidence/compiler.txt
          python3 src/dv/opt_probe.py 2>&1 | tee workdir/opt-evidence/probe.log
          cat /proc/loadavg > workdir/opt-evidence/load-end.txt
          free -b > workdir/opt-evidence/memory-end.txt
      - name: Upload all measurements
        if: ${{ always() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: compiler-optimization-evidence
          path: workdir/opt-evidence/
          if-no-files-found: error
          retention-days: 14
