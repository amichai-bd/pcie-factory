# Disposable issue #435 evidence probe; never merge this workflow.
# Owning methods: wiki/bkm/devops.md and wiki/tools/regress/SPEC.md.
name: isolated coverage evidence

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: isolated-coverage-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  coverage-evidence:
    runs-on: [self-hosted, linux, x64, wsl]
    timeout-minutes: 180
    env:
      SOURCE_SHA: 621d6ad6be653944450b95a45b8f230ef8e4d6a4
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: 621d6ad6be653944450b95a45b8f230ef8e4d6a4
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact source and toolchain
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git log --oneline -1
          git status --porcelain
          python3 --version
          verilator --version
          python3 -c 'import cocotb; print("cocotb", cocotb.__version__)'

      - name: Python dependencies
        run: |
          if python3 -m pip install --dry-run --no-index --quiet -r tools/requirements.txt >/dev/null 2>&1; then
            echo "runner Python satisfies tools/requirements.txt"
          else
            python3 -m venv workdir/venv
            workdir/venv/bin/pip install --quiet -r tools/requirements.txt
            echo "$PWD/workdir/venv/bin" >> "$GITHUB_PATH"
          fi

      - name: Complete unchanged regression levels and coverage floors
        run: |
          set -o pipefail
          mkdir -p workdir/evidence
          git rev-parse HEAD | tee workdir/evidence/source-head.txt
          ./build regress --level 0 --level 1 --coverage --jobs "$(nproc)" 2>&1 | tee workdir/evidence/regression.log

      - name: Upload raw evidence and summary
        if: ${{ always() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: isolated-coverage-evidence
          path: |
            workdir/evidence/
            workdir/regress/summary.json
            workdir/**/coverage.dat
            workdir/**/funcov.json
            workdir/**/sim.log
            workdir/**/results.xml
            workdir/**/coverage/
          if-no-files-found: error
          retention-days: 14
