# Host toolchain pins. Owning spec: wiki/tools/host/SPEC.md.
#
# Read by .claude/hooks/session-start.sh with a small stdlib parser (PyYAML may
# not be installed yet when it runs), so keep this file to the subset that
# parser accepts: nested block mappings, scalars, inline [a, b] lists and
# full-line or trailing "# " comments. No anchors, block lists or multi-line
# strings.

verilator:
  version: "5.052"                  # `verilator --version` prints "Verilator 5.052 ..."
  tag: v5.052                       # git tag built from source
  commit: ea338be98e1e838d3518809ce8899f85a009963c   # v5.052^{}; verified after clone
  repo: https://github.com/verilator/verilator
  prefix: /opt/verilator/5.052      # install prefix; binary at <prefix>/bin/verilator
  # Debian/Ubuntu packages needed to build it (cloud image is Ubuntu).
  build_deps: [git, autoconf, flex, bison, help2man, perl, make, g++, ccache, libfl2, libfl-dev, zlib1g-dev]

python:
  minimum: "3.11"                   # python3 on PATH must be at least this
  requirements: tools/requirements.txt   # exact pins for cocotb, pytest, PyYAML, ...

specs:
  fetch: "true"                     # cloud session-start runs `./build specs fetch`, best effort ("false" to skip)
  text_package: poppler-utils       # Debian/Ubuntu package with pdftotext, which extracts document text

hosts:
  cloud:
    description: Claude Code cloud session (Ubuntu); provisioned by .claude/hooks/session-start.sh
    python: system python3, packages installed into it from tools/requirements.txt
  omarchy:
    description: UNSUPPORTED former self-hosted CI host (Arch Linux); no workflow selects it (#321)
    # Kept as a historical record of what the host agent reported, and for the
    # fpga tool's quartus_root fallback. Its runners carry no wsl label, so no
    # job lands there; taking them offline is a host action for the captain.
    verilator_prefix: /usr          # /usr/bin/verilator, found on PATH
    verilator_version: "5.052"
    python: "3.14.7"                # base interpreter of the runner venv
    venv: runner                    # the runner service's own venv ($VIRTUAL_ENV), first on PATH; holds the cocotb, pytest and PyYAML pins
    quartus_root: /opt/intelFPGA_lite/25.1/quartus   # seen by the fpga workflow (also $QUARTUS_ROOTDIR and on PATH)
    quartus_version: "25.1std.0 Build 1129"         # `quartus_sh --version`; Lite Edition
    pdftotext: "26.08.0"              # from the ci-gate "Reference documents" step log (text extractor line); extracts reference text
  wsl:
    description: self-hosted CI host (Ubuntu 24.04 under WSL2); provisioned by hand; the only supported CI host, every workflow job selects its runner label wsl
    # Versions only; install paths are private to the host and not recorded.
    # Quartus is on the runner PATH. The ORFS pin lives here because the asic
    # tool reads a single ORFS host entry.
    verilator_version: "5.052"      # built from the pinned tag into a user prefix, on the runner PATH
    python: "3.12.3"                # base interpreter of the runner venv
    venv: runner                    # the runner service's own venv ($VIRTUAL_ENV), first on PATH; holds the tools/requirements.txt pins
    quartus_version: "25.1std.0 Build 1129"         # `quartus_sh --version`; Lite Edition
    docker_version: "29.4.0"        # runner service runs in the docker group
    pdftotext: "24.02.0"            # Ubuntu poppler-utils
    orfs_image: "openroad/orfs:26Q4-142-gd4b96380b@sha256:f00e7890ebca6af80a973c2e7a5ccf7ff992c1a65903ac8bee39dfd4a458c811"   # ./build asic pin, pulled on the wsl runners
    orfs_commit: d4b96380b10e          # ORFS revision in that image
    orfs_cores: 4                     # NUM_CORES and docker --cpus for ./build asic
