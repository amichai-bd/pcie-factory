# ci-gate selection rules. Owning spec: wiki/tools/ci/SPEC.md.
# Read by `./build regress --affected` (which IPs a change selects) and by
# `./build ci unit` (which unit-test suites run). Never name an IP here.

# A change to any of these paths, relative to the repository root, selects
# every IP and the tools unit tests. An IP that only such a change selects
# runs only the regression levels in `levels` (a smoke that the tools still
# drive every IP's sims); an IP a design or DV change selects runs every
# requested level.
global:
  prefixes: [tools/, cfg/]
  files: [build]
  levels: [0]

# Directories relative to the source root holding shared DV Python that no
# filelist reaches; a change under one selects every IP.
shared_dv: [dv/common]

# Directory relative to an IP's DV folder (src/dv/<ip>/) holding its
# pure-Python reference models and their unit tests. A change under it also
# selects every ancestor IP (an IP whose rtl filelist reaches this one; parent
# models import sub-IP models), and `./build ci unit` runs the model tests of
# each selected IP. Architecture models live in src/arch/<ip>/ (top-level IPs
# only); a change there selects that IP, and `./build ci unit` runs, for each
# selected IP that has it, the self-tests and `./build arch`.
models: models

# Directory, relative to the repository root, whose Python the DV imports at
# run time (it is on sys.path in every simulation). `--affected` scans the
# imports of each IP's DV and arch Python: a changed file it reaches here, or
# another IP's arch or models module it imports by name, selects that IP at
# every requested level, even when the change is also a global one.
import_root: tools

# pytest paths, relative to the repository root, of the tools unit tests.
tools_tests: [tools]

# Tools tests that build source files a non-global change can touch: when a
# listed path (relative to the repository root; a trailing '/' is a prefix)
# changes and no global path did, `./build ci unit --affected` runs the tools
# tests carrying this pytest marker. A global change runs them with the rest.
# paths must name exactly the vocabulary headers of the RTL style check
# (VOCABULARY_HEADERS in tools/checks/style.py); a checks unit test enforces it.
vocabulary_tests:
  marker: vocabulary
  paths: [src/rtl/common/common_macros.svh, src/rtl/common/common_assertions.svh]

# These workflow files select all vendor targets in addition to global paths.
# Source selection uses synthesis filelists and the target's vendor folder.
vendor:
  files: [.github/workflows/ci.yml, .github/workflows/fpga.yml, .github/workflows/asic.yml, .github/workflows/nightly.yml]
