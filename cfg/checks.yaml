# Static check configuration for ./build check.
# Owning spec: wiki/tools/checks/SPEC.md.
#
# The neutrality check scans this file like any other, except that it
# blanks the `words` list and the `repo_slug` value first. Keep `words` a
# one-line flow list; comments and any other text here are still scanned.
# The exempt trees are fixed by CLAUDE.md and hard-coded in the tool.

neutrality:
  # Case-insensitive substrings. A space, '-' or '_' inside a word matches
  # any run of those characters, including none.
  words: [pcie, pci express, pci sig, ltssm, dllp]
  # owner/repo exempt inside GitHub URLs; unset means "from the origin remote".
  # repo_slug: owner/repo

citation:
  # A Markdown block quote or a quoted run with more words than this is a
  # finding; the citation form is fixed by the wiki BKM.
  max_quote_words: 25

publishability:
  # Reviewed exemptions only. Each entry exempts the exact matched text of
  # one rule (in the files its optional fnmatch `path` glob names) and says
  # why; an entry that matches nothing fails the check as stale.
  allow:
    - rule: email
      match: git@github.com
      reason: the SSH user of a Git host remote URL, not a person
    - rule: home-path
      match: /home/someone
      path: tools/metrics/tests/*
      reason: placeholder home path planted to test that metrics records refuse it
    - rule: ipv4
      match: 10.1.2.3
      path: tools/metrics/tests/test_metrics_record.py
      reason: made-up private address planted to test that metrics records refuse it
    - rule: ipv6
      match: fe80::1
      path: tools/metrics/tests/test_metrics_record.py
      reason: generic link-local address planted to test that metrics records refuse it
    - rule: token
      match: AKIAABCDEFGHIJKLMNOP
      path: tools/metrics/tests/test_metrics_record.py
      reason: fake key-shaped string (the alphabet) planted to test that metrics records refuse it

spec_cache:
  # Reviewed exemptions from the spec-cache check's archive rule only (a
  # .zip, .gz, .tgz, .7z or .tar* file can hide a reference document). Each
  # entry is an fnmatch `path` glob and a `reason`; one that matches no
  # archive fails the check as stale. PDFs and cached text are never exempt.
  allow: []
