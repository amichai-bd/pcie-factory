# Regression level budgets, read by ./build regress (see wiki/tools/regress/SPEC.md).
# budget_s is CPU time: it is compared with the sum of the level's per-test
# CPU time (user + system of each test's process tree), which host load barely
# changes; exceeding it prints a warning. The DevOps BKM owns these values and
# each level's purpose (Levels and budgets).
level0:
  description: Did we break the build - elaboration, lint and the fastest smoke checks; run while developing and first in ci-gate.
  budget_s: 120
level1:
  description: The PR gate - functional checks of the affected IPs, run by ci-gate after level 0.
  budget_s: 1200
level2:
  description: The full test, nightly - long tests, sweeps, soaks and coverage floors; for a PR only targeted entries.
  budget_s: 9600
# Seed rotation (./build regress --rotate KEY; the nightly passes the date):
# extra_seeds more seeds per entry of `level`, derived from KEY, run on plain
# builds (no coverage) and started only while their CPU time is under
# budget_s. Sized so the nightly's L2 stays inside level2.budget_s: the pinned
# L2 measured 3394.6 s of CPU for #327, plus at most this budget and the runs
# already started. The DevOps BKM owns these values (Nightly).
rotation:
  level: 2
  extra_seeds: 1
  budget_s: 3600
