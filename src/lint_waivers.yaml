waivers:
  # The pcs HAS (Clocks and reset) feeds rst_i straight into the RX-domain
  # reset synchronizer (its asynchronous input) and also resets the clk_i
  # side with it synchronously, which is inherent to COMMON_RESET_SYNC. The
  # RX reset itself has one consumer style: every RX-domain flop, the
  # crossing cells' RX sides included, takes it asynchronously (#170), so it
  # needs no waiver.
  - file: rtl/pcs/pcie_pcs.sv
    rule: SYNCASYNCNET
    match: "'rst_i'"
    reason: rst_i is the synchronous clk_i-side reset of the pcs top and reaches the RX reset synchronizer in u_elastic (crossing 2), as the pcs HAS requires.
  # pcie_phy instantiates pcie_pcs (#86): the same rst_i net, seen from the
  # phy top.
  - file: rtl/phy/pcie_phy.sv
    rule: SYNCASYNCNET
    match: "'rst_i'"
    reason: rst_i resets the stack synchronously and reaches the pcs RX reset synchronizer (pcs crossing 2), as the phy and pcs HAS require.
  # The phy DE2-115 wrapper (#87) instantiates pcie_phy as the FPGA top:
  # the same rst_i net, seen from the wrapper.
  - file: fpga/phy/pcie_phy_de2_115.sv
    rule: SYNCASYNCNET
    match: "'pcie_phy_de2_115.rst_q'"
    reason: rst_q drives pcie_phy rst_i, which resets the stack synchronously and reaches the pcs RX reset synchronizer (pcs crossing 2), as the phy and pcs HAS require; it is a flop with no logic after it, as common_cdc_rst requires.
  # pcie_link stacks pcie_dll over pcie_phy (#215): the same rst_i net,
  # seen from the link top; the dll takes it synchronously like the phy's
  # clk_i side.
  - file: rtl/link/pcie_link.sv
    rule: SYNCASYNCNET
    match: "'rst_i'"
    reason: rst_i resets the dll and the phy synchronously and reaches the pcs RX reset synchronizer (pcs crossing 2), as the link, phy and pcs HAS require.
  # The link DE2-115 wrapper (#218) instantiates pcie_link as the FPGA top:
  # the same rst_i net, seen from the wrapper.
  - file: fpga/link/pcie_link_de2_115.sv
    rule: SYNCASYNCNET
    match: "'pcie_link_de2_115.rst_q'"
    reason: rst_q drives pcie_link rst_i, which resets the dll and the phy synchronously and reaches the pcs RX reset synchronizer (pcs crossing 2), as the link, phy and pcs HAS require; it is a flop with no logic after it, as common_cdc_rst requires.
  # pcie_core stacks pcie_tl and pcie_cfg over pcie_link (#293): the same
  # rst_i net, seen from the core top; tl and cfg take it synchronously.
  - file: rtl/core/pcie_core.sv
    rule: SYNCASYNCNET
    match: "'rst_i'"
    reason: rst_i resets the link, tl and cfg synchronously and reaches the pcs RX reset synchronizer (pcs crossing 2), as the core, link, phy and pcs HAS require.
  # The core DE2-115 wrapper (#295) instantiates pcie_core as the FPGA top:
  # the same rst_i net, seen from the wrapper.
  - file: fpga/core/pcie_core_de2_115.sv
    rule: SYNCASYNCNET
    match: "'pcie_core_de2_115.rst_q'"
    reason: rst_q drives pcie_core rst_i, which resets the link, tl and cfg synchronously and reaches the pcs RX reset synchronizer (pcs crossing 2), as the core, link, phy and pcs HAS require; it is a flop with no logic after it, as common_cdc_rst requires.
  # pcie_gpio (#378): the same pattern as the pcs. rst_i resets the clk_i
  # side synchronously and is the input of the receive-domain reset
  # synchronizer in u_rx_front, as the gpio HAS (clocks and resets)
  # requires; every gpio_rx_clk_i flop takes the synchronized reset
  # asynchronously.
  - file: rtl/gpio/pcie_gpio.sv
    rule: SYNCASYNCNET
    match: "'rst_i'"
    reason: rst_i resets the gpio clk_i side synchronously and reaches the receive-domain reset synchronizer, as the gpio HAS (clocks and resets) requires.
  # pcie_rc stacks pcie_rc_tl and pcie_rc_seq over pcie_link (#377): the
  # same rst_i net, seen from the rc top; rc_tl and rc_seq take it
  # synchronously.
  - file: rtl/rc/pcie_rc.sv
    rule: SYNCASYNCNET
    match: "'rst_i'"
    reason: rst_i resets the link, rc_tl and rc_seq synchronously and reaches the pcs RX reset synchronizer (pcs crossing 2), as the rc, link, phy and pcs HAS require.
