tests:
  - name: e2e_link_up_spec
    module: tests.test_phy_e2e
    testcase: e2e_link_up_spec
    top: pcie_phy_e2e_tb
    params: {MAC_RTL: 1, PCS_RTL: 1, CHAN_RTL: 1, TIMEOUT_DIV: 1}
    timeout_s: 900
  - name: e2e_soak_dsp_first
    module: tests.test_phy_e2e
    testcase: e2e_soak_dsp_first
    top: pcie_phy_e2e_tb
    params: {MAC_RTL: 1, PCS_RTL: 1}
    seeds: 4
    timeout_s: 900
  - name: e2e_soak_usp_first
    module: tests.test_phy_e2e
    testcase: e2e_soak_usp_first
    top: pcie_phy_e2e_tb
    params: {MAC_RTL: 1, PCS_RTL: 1}
    seeds: 4
    timeout_s: 900
  - name: e2e_soak_dsp_first_model
    module: tests.test_phy_e2e
    testcase: e2e_soak_dsp_first
    top: pcie_phy_e2e_tb
    seeds: 2
    timeout_s: 900
  - name: e2e_soak_usp_first_model
    module: tests.test_phy_e2e
    testcase: e2e_soak_usp_first
    top: pcie_phy_e2e_tb
    seeds: 2
    timeout_s: 900
# Floors: the merged L0 to L2 value (the nightly runs the three together)
# minus 0.5 points, rounded down to 0.1 (DV BKM, Coverage). Every point
# below 100% has a reason in the DV plan (#90).
# Measured 78.80% line, 75.70% toggle; functional 100% holds every bin
# of every phy_e2e_* covergroup.
coverage_floors: {line: 78.2, toggle: 75.1, functional: 100}
