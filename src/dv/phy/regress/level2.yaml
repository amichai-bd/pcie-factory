    top: pcie_phy_e2e_tb
    params: {MAC_RTL: 1, PCS_RTL: 1, CHAN_RTL: 1, TIMEOUT_DIV: 1}
    timeout_s: 900
  - name: e2e_soak_dsp_first
    module: tests.test_phy_e2e
    testcase: e2e_soak_dsp_first
    top: pcie_phy_e2e_tb
    params: {MAC_RTL: 1, PCS_RTL: 1}
    seeds: 4
    timeout_s: 900
  - name: e2e_soak_usp_first
    module: tests.test_phy_e2e
    testcase: e2e_soak_usp_first
    top: pcie_phy_e2e_tb
    params: {MAC_RTL: 1, PCS_RTL: 1}
    seeds: 4
    timeout_s: 900
  - name: e2e_soak_dsp_first_model
    module: tests.test_phy_e2e
    testcase: e2e_soak_dsp_first
    top: pcie_phy_e2e_tb
    seeds: 2
    timeout_s: 900
  - name: e2e_soak_usp_first_model
    module: tests.test_phy_e2e
    testcase: e2e_soak_usp_first
    top: pcie_phy_e2e_tb
    seeds: 2
    timeout_s: 900
# Floors: the higher of the existing floor and the merged L0 to L2 value
# (the nightly runs the three together) minus 0.5 points, rounded down to
# 0.1 (DV BKM, Coverage); a floor is never lowered. Every point below 100%
# has a reason in the DV plan (#90).
# Measured 78.80% line, 75.70% toggle. Functional 100 must hold every bin
# of phy_e2e_layers, phy_e2e_run, phy_e2e_events, phy_e2e_packets,
# phy_e2e_control and phy_e2e_power; a renamed or undeclared covergroup
# leaves the total, so keep this list.
coverage_floors: {line: 78.2, toggle: 75.1, functional: 100}
