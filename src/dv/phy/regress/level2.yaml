# The nine `_model` copies run the models only (no RTL behaviour change
# can fail them; a compile break or a reset-time assertion fails the
# non-reused entries of the same build): each reruns when its models,
# testbench or tools change and otherwise reuses its last pass on the
# host, and none is a coverage run (DV plan, Level placement; #327).
tests:
  - name: e2e_link_up_spec
    seed_independent: true
    module: tests.test_phy_e2e
    testcase: e2e_link_up_spec
    top: pcie_phy_e2e_tb
    params: {MAC_RTL: 1, PCS_RTL: 1, CHAN_RTL: 1, TIMEOUT_DIV: 1}
    timeout_s: 900
  - name: e2e_soak_dsp_first
    module: tests.test_phy_e2e
    testcase: e2e_soak_dsp_first
    top: pcie_phy_e2e_tb
    params: {MAC_RTL: 1, PCS_RTL: 1}
    seeds: [729640957, 1165168337, 846478919]
    timeout_s: 900
    coverage_seeds: 3
  - name: e2e_soak_usp_first
    module: tests.test_phy_e2e
    testcase: e2e_soak_usp_first
    top: pcie_phy_e2e_tb
    params: {MAC_RTL: 1, PCS_RTL: 1}
    seeds: 2
    timeout_s: 900
    coverage_seeds: 2
  - name: e2e_soak_dsp_first_model
    module: tests.test_phy_e2e
    testcase: e2e_soak_dsp_first
    top: pcie_phy_e2e_tb
    seeds: 2
    timeout_s: 900
    coverage_seeds: 0
    rerun_when: models_change
  - name: e2e_soak_usp_first_model
    module: tests.test_phy_e2e
    testcase: e2e_soak_usp_first
    top: pcie_phy_e2e_tb
    seeds: 2
    timeout_s: 900
    coverage_seeds: 0
    rerun_when: models_change
  - name: e2e_reset_single
    module: tests.test_phy_e2e
    testcase: e2e_reset_single
    top: pcie_phy_e2e_tb
    params: {MAC_RTL: 1, PCS_RTL: 1, ERR_TIMEOUT_DIV: 1024}
    timeout_s: 300
  - name: e2e_dsp_first_pos600_model
    module: tests.test_phy_e2e
    testcase: e2e_dsp_first_pos600
    top: pcie_phy_e2e_tb
    timeout_s: 180
    coverage_seeds: 0
    rerun_when: models_change
  - name: e2e_dsp_first_neg300_model
    module: tests.test_phy_e2e
    testcase: e2e_dsp_first_neg300
    top: pcie_phy_e2e_tb
    timeout_s: 180
    coverage_seeds: 0
    rerun_when: models_change
  - name: e2e_usp_first_neg600_model
    module: tests.test_phy_e2e
    testcase: e2e_usp_first_neg600
    top: pcie_phy_e2e_tb
    timeout_s: 180
    coverage_seeds: 0
    rerun_when: models_change
  - name: e2e_usp_first_pos300_model
    module: tests.test_phy_e2e
    testcase: e2e_usp_first_pos300
    top: pcie_phy_e2e_tb
    timeout_s: 180
    coverage_seeds: 0
    rerun_when: models_change
  - name: e2e_symbol_errors_model
    module: tests.test_phy_e2e
    testcase: e2e_symbol_errors
    top: pcie_phy_e2e_tb
    seeds: 2
    timeout_s: 180
    coverage_seeds: 0
    rerun_when: models_change
  - name: e2e_bit_slips_model
    module: tests.test_phy_e2e
    testcase: e2e_bit_slips
    top: pcie_phy_e2e_tb
    seeds: 2
    timeout_s: 180
    coverage_seeds: 0
    rerun_when: models_change
  - name: e2e_elec_idle_model
    module: tests.test_phy_e2e
    testcase: e2e_elec_idle
    top: pcie_phy_e2e_tb
    seeds: 2
    timeout_s: 180
    coverage_seeds: 0
    rerun_when: models_change
  # The RTL entries' derived seed 1, moved here from level 1 unchanged
  # with its coverage instrumentation (#389; DV plan, Level placement).
  - name: e2e_bit_slips_sweep
    module: tests.test_phy_e2e
    testcase: e2e_bit_slips
    top: pcie_phy_e2e_tb
    params: {MAC_RTL: 1, PCS_RTL: 1}
    seeds: [1336911784]
    timeout_s: 180
# Floors: the higher of the existing floor and the merged L0 to L2 value
# (the nightly runs the three together) minus 0.5 points, rounded down to
# 0.1 (DV BKM, Coverage); a floor is never lowered. Every point below 100%
# has a reason in the DV plan (#90).
# Measured source union (#228): 92.09% line (920/999), 88.74% toggle
# (7543/8500). Functional 100 must hold every bin of phy_e2e_layers,
# phy_e2e_run, phy_e2e_events, phy_e2e_packets, phy_e2e_control and
# phy_e2e_power; a renamed or undeclared covergroup leaves the total, so
# keep this list.
coverage_floors: {line: 91.5, toggle: 88.2, functional: 100}
