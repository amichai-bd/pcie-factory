# Sweeps: the convergence cases at the other ratios and at CLK_DIV 4, the
# traffic, error and reset tests at ratios 1/2 and 2, CLK_DIV 4 and 64.
tests:
  - name: converge_equal
    module: tests.test_gpio
    testcase: converge
    top: pcie_gpio_tb
    timeout_s: 600
  - name: converge_half
    module: tests.test_gpio
    testcase: converge
    top: pcie_gpio_tb
    params: {RATIO: 0}
    timeout_s: 600
  - name: converge_div4
    module: tests.test_gpio
    testcase: converge
    top: pcie_gpio_tb
    params: {CLK_DIV: 4, RATIO: 0}
    timeout_s: 900
  - name: traffic_half
    module: tests.test_gpio
    testcase: traffic
    top: pcie_gpio_tb
    params: {RATIO: 0}
    timeout_s: 600
  - name: traffic_double
    module: tests.test_gpio
    testcase: traffic
    top: pcie_gpio_tb
    params: {RATIO: 2}
    timeout_s: 600
  - name: traffic_div4
    module: tests.test_gpio
    testcase: traffic
    top: pcie_gpio_tb
    params: {CLK_DIV: 4, RATIO: 2}
    timeout_s: 600
  - name: smoke_div64
    module: tests.test_gpio
    testcase: smoke
    top: pcie_gpio_tb
    params: {CLK_DIV: 64, RATIO: 0}
    timeout_s: 900
  - name: errors_half
    module: tests.test_gpio
    testcase: errors
    top: pcie_gpio_tb
    params: {RATIO: 0}
    timeout_s: 600
  - name: errors_double
    module: tests.test_gpio
    testcase: errors
    top: pcie_gpio_tb
    params: {RATIO: 2}
    timeout_s: 600
  # Derived seed 0, then 1331881895 (#468): b reset inside a sop slot,
  # which a completes with b's first transfer after the restart.
  - name: restart_double
    module: tests.test_gpio
    testcase: restart
    top: pcie_gpio_tb
    params: {RATIO: 2}
    seeds: [79652860, 1331881895]
    timeout_s: 600
  - name: hot_reset_half
    module: tests.test_gpio
    testcase: hot_reset
    top: pcie_gpio_tb
    params: {RATIO: 0}
    timeout_s: 600
  - name: train_cases_half
    module: tests.test_gpio
    testcase: train_cases
    top: pcie_gpio_tb
    params: {RATIO: 0}
    timeout_s: 600
  - name: train_cases_double
    module: tests.test_gpio
    testcase: train_cases
    top: pcie_gpio_tb
    params: {RATIO: 2}
    timeout_s: 600
  - name: hot_reset_double
    module: tests.test_gpio
    testcase: hot_reset
    top: pcie_gpio_tb
    params: {RATIO: 2}
    timeout_s: 600
# Coverage floors (#380), levels 0 to 2 merged, the code floors the merged
# value less 0.5 points rounded down to a tenth (DV BKM, floor margin):
# measured 91.53% line (595/650), 92.23% toggle (4302/4664); every point not
# hit has a reason in the DV plan (Coverage holes). An entry with a new
# parameter set (a new CLK_DIV), or an RTL change that adds state,
# re-measures these floors in the same PR.
# Functional 100 must hold every bin of gpio_config, gpio_link,
# gpio_rx_table and gpio_slot; a renamed or undeclared covergroup leaves the
# total, so keep this list.
coverage_floors: {line: 91.0, toggle: 91.7, functional: 100}
