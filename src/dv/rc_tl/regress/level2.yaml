tests:
  - name: random_long
    module: tests.test_rc_tl_cmd
    testcase: random_long
    top: pcie_rc_tl_tb
    seeds: 2
    timeout_s: 1200
  - name: random_req_long
    module: tests.test_rc_tl_req
    testcase: random_req_long
    top: pcie_rc_tl_tb
    seeds: 2
    timeout_s: 3600
    params: {CPL_TIMEOUT_DIV: 1024}
  # The completion timeout at the FPGA value, CPL_TIMEOUT_DIV 1: 2**21 cycles.
  - name: req_timeout_div1
    seed_independent: true
    module: tests.test_rc_tl_req
    testcase: timeout_once
    top: pcie_rc_tl_tb
    timeout_s: 2400
  - name: random_inb_long
    module: tests.test_rc_tl_inb
    testcase: random_inb_long
    top: pcie_rc_tl_tb
    seeds: 2
    timeout_s: 3600
  - name: random_cmds_extra_seeds
    module: tests.test_rc_tl_cmd
    testcase: random_cmds
    top: pcie_rc_tl_tb
    seeds:
    - 1976110523
    timeout_s: 300
    coverage_seeds: 0
  # The level 1 random_req runs 750 commands (#435); random_req_full runs
  # its seed at the full 1500, as random_req_extra_seeds does its own.
  - name: random_req_full
    module: tests.test_rc_tl_req
    testcase: random_req_full
    top: pcie_rc_tl_tb
    seeds: [169113172]
    timeout_s: 600
    params:
      CPL_TIMEOUT_DIV: 1024
  - name: random_req_extra_seeds
    module: tests.test_rc_tl_req
    testcase: random_req_full
    top: pcie_rc_tl_tb
    seeds:
    - 2098415298
    timeout_s: 600
    params:
      CPL_TIMEOUT_DIV: 1024
    coverage_seeds: 0
# Coverage floors (#380), levels 0 to 2 merged, by source (#228): the
# merged value less 0.5 points rounded down to a tenth, never below the
# existing floor (DV BKM, floor margin): 99.26% line (403/406) and 91.43%
# toggle (13781/15072). The per-instance figures behind the earlier floors
# are in the DV plan (Coverage holes), where every point not hit has a
# reason. An entry with a new parameter set, or an RTL change that adds
# state, re-measures these floors in the same PR.
# Functional 100 must hold every bin of rc_tl_cmd, rc_tl_cpl, rc_tl_cplr,
# rc_tl_host, rc_tl_inb, rc_tl_req and rc_tl_reset; a renamed or undeclared
# covergroup leaves the total, so keep this list.
coverage_floors: {line: 98.7, toggle: 90.9, functional: 100}
