tests:
  # Type 1 header: reset values, then with the IDs set.
  - name: hdr_reset
    module: tests.test_rc_tl_hdr
    testcase: hdr_reset
    top: pcie_rc_tl_tb
    timeout_s: 300
  - name: hdr_reset_ids
    module: tests.test_rc_tl_hdr
    testcase: hdr_reset
    top: pcie_rc_tl_tb
    timeout_s: 300
    params: {VENDOR_ID: 0x1234, DEVICE_ID: 0xABCD, REVISION_ID: 0x5A}
  - name: hdr_rw
    module: tests.test_rc_tl_hdr
    testcase: hdr_rw
    top: pcie_rc_tl_tb
    timeout_s: 300
  # Front end: checks 2 to 5, byte enables, routing, check 1 and the
  # result beats.
  - name: cmd_checks
    module: tests.test_rc_tl_cmd
    testcase: cmd_checks
    top: pcie_rc_tl_tb
    timeout_s: 300
  - name: byte_enables
    module: tests.test_rc_tl_cmd
    testcase: byte_enables
    top: pcie_rc_tl_tb
    timeout_s: 300
  - name: routing
    module: tests.test_rc_tl_cmd
    testcase: routing
    top: pcie_rc_tl_tb
    timeout_s: 300
  - name: check1
    module: tests.test_rc_tl_cmd
    testcase: check1
    top: pcie_rc_tl_tb
    timeout_s: 300
  - name: result_beats
    module: tests.test_rc_tl_cmd
    testcase: result_beats
    top: pcie_rc_tl_tb
    timeout_s: 300
  - name: random_cmds
    module: tests.test_rc_tl_cmd
    testcase: random_cmds
    top: pcie_rc_tl_tb
    seeds: 2
    timeout_s: 300
  # Requester: requests, completion statuses and checks, splits,
  # unexpected completions, the timeout, link down, credits, the error
  # record; random endpoint commands against the model.
  - name: req_success
    module: tests.test_rc_tl_req
    testcase: req_success
    top: pcie_rc_tl_tb
    timeout_s: 300
  - name: req_status
    module: tests.test_rc_tl_req
    testcase: req_status
    top: pcie_rc_tl_tb
    timeout_s: 300
    params: {CPL_TIMEOUT_DIV: 1024}
  - name: req_malformed
    module: tests.test_rc_tl_req
    testcase: req_malformed
    top: pcie_rc_tl_tb
    timeout_s: 300
    params: {CPL_TIMEOUT_DIV: 1024}
  - name: req_split
    module: tests.test_rc_tl_req
    testcase: req_split
    top: pcie_rc_tl_tb
    timeout_s: 300
    params: {CPL_TIMEOUT_DIV: 1024}
  - name: req_unexpected
    module: tests.test_rc_tl_req
    testcase: req_unexpected
    top: pcie_rc_tl_tb
    timeout_s: 300
    params: {CPL_TIMEOUT_DIV: 1024}
  - name: req_timeout
    module: tests.test_rc_tl_req
    testcase: req_timeout
    top: pcie_rc_tl_tb
    timeout_s: 300
    params: {CPL_TIMEOUT_DIV: 1024}
  - name: req_timeout_div1000
    module: tests.test_rc_tl_req
    testcase: req_timeout
    top: pcie_rc_tl_tb
    timeout_s: 300
    params: {CPL_TIMEOUT_DIV: 1000}
  - name: req_link_down
    module: tests.test_rc_tl_req
    testcase: req_link_down
    top: pcie_rc_tl_tb
    timeout_s: 300
    params: {CPL_TIMEOUT_DIV: 1024}
  - name: req_credits
    module: tests.test_rc_tl_req
    testcase: req_credits
    top: pcie_rc_tl_tb
    timeout_s: 300
    params: {CPL_TIMEOUT_DIV: 1024}
  - name: err_record
    module: tests.test_rc_tl_req
    testcase: err_record
    top: pcie_rc_tl_tb
    timeout_s: 300
    params: {CPL_TIMEOUT_DIV: 1024}
  - name: random_req
    module: tests.test_rc_tl_req
    testcase: random_req
    top: pcie_rc_tl_tb
    seeds: 2
    timeout_s: 600
    params: {CPL_TIMEOUT_DIV: 1024}
  # Every parameter check fires on illegal values; the boundaries pass.
  - name: param_limits
    module: tests.test_rc_tl_params
    testcase: param_limits
    top: pcie_rc_tl_tb
    timeout_s: 300
