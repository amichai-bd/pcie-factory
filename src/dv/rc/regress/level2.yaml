# Error and replay sweeps retain additional instance/source coverage
# (wiki/src/dv/rc/DV_PLAN.md); new seeds derived from each entry's name.
tests:
  - name: e2e_errors_sweep
    module: tests.test_rc_e2e
    testcase: e2e_errors
    top: pcie_rc_e2e_tb
    params: {PROGRAM: 3, CPL_TIMEOUT_DIV: 64}
    seeds: 3
    timeout_s: 900
  - name: e2e_link_errors_sweep
    module: tests.test_rc_e2e
    testcase: e2e_link_errors
    top: pcie_rc_e2e_tb
    params: {PROGRAM: 1}
    seeds: 4
    timeout_s: 600
# Coverage floors (#380), levels 0 to 2 merged, the code floors the merged
# value less 0.5 points rounded down to a tenth (DV BKM, floor margin):
# measured 73.32% line (3400/4637), 45.88% toggle (48923/106620) over what
# rc.rtl.f reaches (rc_tl, rc_seq and the link stack; core is DV-only here);
# every point not hit has a reason in the DV plan (Coverage holes). An
# entry with a new parameter set, or an RTL change in the stack that adds
# state, re-measures these floors in the same PR.
# Functional floors per covergroup, rc's own only: the e2e also samples
# core's core_e2e_* groups through the reused endpoint model, which hold
# core's floors in its own level file, not here. rc_e2e_line and rc_shell
# hold every bin; rc_e2e_err (11 of 13) and rc_e2e_run (39 of 61) the
# merged value less 0.5 points, with each bin not hit explained in the DV
# plan (Coverage holes), so losing any one bin fails. rc_e2e_run's 22 bins
# not hit are reachable but drawn by no program; since the programs are
# fixed in rc_seq's ROM, a later change could reshape the cross to the
# drawn pairs so that its floor can be 100.
coverage_floors:
  line: 83.1
  toggle: 66.5
  functional: {rc_e2e_err: 84.1, rc_e2e_line: 100, rc_e2e_run: 63.4, rc_shell: 100}
