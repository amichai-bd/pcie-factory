    top: pcie_mac_ltssm_tb
    timeout_s: 600
    params: {TIMEOUT_DIV: 1024, ERR_TIMEOUT_DIV: 1024}
  - name: polarity
    module: tests.test_mac_ltssm
    testcase: polarity
    top: pcie_mac_ltssm_tb
    timeout_s: 300
