# The core back-to-back e2e against the independent host model, default
# parameters (wiki/src/dv/core/DV_PLAN.md): the issue's acceptance tests,
# the link-to-cfg wiring and link down (the core's own reset gate). The
# throughput screen runs at level 2 (budget placement in the DV plan).
tests:
  - name: e2e_functional
    module: tests.test_core_e2e
    testcase: e2e_functional
    top: pcie_core_e2e_tb
    seeds: [914163979]
    timeout_s: 600
  - name: e2e_error_paths
    module: tests.test_core_e2e
    testcase: e2e_error_paths
    top: pcie_core_e2e_tb
    seeds: [116918796]
    timeout_s: 600
  # Line corruption depends on the fresh link sequence/disparity state.
  - name: e2e_link_errors
    module: tests.test_core_e2e
    testcase: e2e_link_errors
    top: pcie_core_e2e_tb
    timeout_s: 600
  - name: e2e_link_down
    module: tests.test_core_e2e
    testcase: e2e_link_down
    top: pcie_core_e2e_tb
    timeout_s: 600
