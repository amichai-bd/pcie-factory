# Long tests, other parameters and seed sweeps of the core e2e
# (wiki/src/dv/core/DV_PLAN.md); new seeds derived from each entry's name.
tests:
  # The core HAS throughput targets, end to end (scenario sizes of the
  # architecture model's perf files, halved for reads and both ways).
  - name: e2e_throughput_host_write
    module: tests.test_core_e2e
    testcase: e2e_throughput_host_write
    top: pcie_core_e2e_tb
    timeout_s: 1200
  - name: e2e_throughput_app_write
    module: tests.test_core_e2e
    testcase: e2e_throughput_app_write
    top: pcie_core_e2e_tb
    timeout_s: 1200
  - name: e2e_throughput_host_read
    module: tests.test_core_e2e
    testcase: e2e_throughput_host_read
    top: pcie_core_e2e_tb
    timeout_s: 1200
  - name: e2e_throughput_app_read
    module: tests.test_core_e2e
    testcase: e2e_throughput_app_read
    top: pcie_core_e2e_tb
    timeout_s: 1200
  - name: e2e_throughput_bidir
    module: tests.test_core_e2e
    testcase: e2e_throughput_bidir
    top: pcie_core_e2e_tb
    timeout_s: 1200
  - name: e2e_d3hot
    module: tests.test_core_e2e
    testcase: e2e_d3hot
    top: pcie_core_e2e_tb
    timeout_s: 600
  - name: e2e_soak
    module: tests.test_core_e2e
    testcase: e2e_soak
    top: pcie_core_e2e_tb
    seeds: 3
    timeout_s: 1200
  # Other parameters: the largest BAR0 and MSI-X table with non-zero IDs,
  # and the minimum credits the core HAS allows, which make the credit
  # release (FC_RELEASE 1) gate every host request. With minimum credits the
  # host's completions wait behind its credit-blocked writes (posted first),
  # longer than the bench's default 2048-cycle completion timeout
  # (CPL_TIMEOUT_DIV 1024); the soak, which issues rq reads, uses
  # CPL_TIMEOUT_DIV 16 (e2e_bar_traffic issues none).
  - name: e2e_enumeration_max
    module: tests.test_core_e2e
    testcase: e2e_enumeration
    top: pcie_core_e2e_tb
    params: {BAR0_ADDR_W: 20, MSIX_TABLE_SIZE: 64, VENDOR_ID: 6699, DEVICE_ID: 15437,
             SUBSYS_VENDOR_ID: 24175, SUBSYS_ID: 28801, CLASS_CODE: 360448, REVISION_ID: 90}
    timeout_s: 600
  - name: e2e_msix_max
    module: tests.test_core_e2e
    testcase: e2e_msix
    top: pcie_core_e2e_tb
    params: {BAR0_ADDR_W: 20, MSIX_TABLE_SIZE: 64, VENDOR_ID: 6699, DEVICE_ID: 15437,
             SUBSYS_VENDOR_ID: 24175, SUBSYS_ID: 28801, CLASS_CODE: 360448, REVISION_ID: 90}
    timeout_s: 600
  - name: e2e_soak_max
    module: tests.test_core_e2e
    testcase: e2e_soak
    top: pcie_core_e2e_tb
    params: {BAR0_ADDR_W: 20, MSIX_TABLE_SIZE: 64, VENDOR_ID: 6699, DEVICE_ID: 15437,
             SUBSYS_VENDOR_ID: 24175, SUBSYS_ID: 28801, CLASS_CODE: 360448, REVISION_ID: 90}
    seeds: 2
    timeout_s: 1200
  # Derived seed 0, then 2047883931 (#468): a BAR0 write passes an
  # outstanding read of the same bytes.
  - name: e2e_bar_traffic_min_credits
    module: tests.test_core_e2e
    testcase: e2e_bar_traffic
    top: pcie_core_e2e_tb
    params: {FC_PH: 1, FC_PD: 8, FC_NPH: 1, FC_NPD: 2}
    seeds: [1443202114, 2047883931]
    timeout_s: 600
  - name: e2e_soak_min_credits
    module: tests.test_core_e2e
    testcase: e2e_soak
    top: pcie_core_e2e_tb
    params: {FC_PH: 1, FC_PD: 8, FC_NPH: 1, FC_NPD: 2, CPL_TIMEOUT_DIV: 16}
    seeds: 2
    timeout_s: 1200
  - name: e2e_cpl_timeout_div64
    module: tests.test_core_e2e
    testcase: e2e_cpl_timeout
    top: pcie_core_e2e_tb
    params: {CPL_TIMEOUT_DIV: 64}
    timeout_s: 900
  # Seed sweeps of the level 1 entries.
  - name: e2e_bar_traffic_sweep
    module: tests.test_core_e2e
    testcase: e2e_bar_traffic
    top: pcie_core_e2e_tb
    seeds: 3
    timeout_s: 600
  - name: e2e_bus_master_sweep
    module: tests.test_core_e2e
    testcase: e2e_bus_master
    top: pcie_core_e2e_tb
    seeds: 3
    timeout_s: 600
  - name: e2e_msix_sweep
    module: tests.test_core_e2e
    testcase: e2e_msix
    top: pcie_core_e2e_tb
    seeds: 2
    timeout_s: 600
  - name: e2e_errors_sweep
    module: tests.test_core_e2e
    testcase: e2e_errors
    top: pcie_core_e2e_tb
    seeds: 2
    timeout_s: 600
  - name: e2e_throughput_short
    module: tests.test_core_e2e
    testcase: e2e_throughput_short
    top: pcie_core_e2e_tb
    timeout_s: 600
# Floors on the merged levels 0 to 2 (the nightly run), at the merged value
# less 0.5 points rounded down to a tenth (DV BKM, floor margin): measured
# 75.88% line (4168/5493), 44.63% toggle (77783/174278) over the whole
# stack; every point not hit has a reason in the DV plan (Coverage holes).
# Re-measured for #416 (after #393 and #378): 75.84% line (4172/5501),
# 44.59% toggle (78118/175198); both floors hold and stay.
# An entry with a new parameter set, or an RTL change in the stack that adds
# state, re-measures these floors in the same PR.
# Functional 100 must hold every bin of core_e2e_enum, core_e2e_err,
# core_e2e_irq, core_e2e_traffic and core_smoke; a renamed or undeclared
# covergroup leaves the total, so keep this list.
coverage_floors: {line: 75.3, toggle: 44.1, functional: 100}
