# Coverage floors (#380), levels 0 to 2 merged, the code floors the merged
# value less 0.5 points rounded down to a tenth (DV BKM, floor margin):
# measured 59.22% line (106/179, #426), 72.93% toggle (4758/6524); every
# point not hit has a reason in the DV plan (Coverage holes). The line floor
# was lowered from 59.3 to 58.7 in #426 (firstmate delegate decision): #413
# added two elaboration-only function blocks that no test can reach. A new program, an entry
# with a new parameter set, or an RTL change that adds state re-measures
# these floors in the same PR.
# Functional 100 must hold every bin of rc_seq_jumps, rc_seq_run and
# rc_seq_steps; a renamed or undeclared covergroup leaves the total, so keep
# this list.
coverage_floors: {line: 58.7, toggle: 72.4, functional: 100}
