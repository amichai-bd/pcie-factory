    seeds: 2
    timeout_s: 1200
    params: {TIMEOUT_DIV: 1024, ERR_TIMEOUT_DIV: 1024}
# Floors: the higher of the existing floor and the merged L0 to L2 value
# (the nightly runs the three together) minus 0.5 points, rounded down to
# 0.1 (DV BKM, Coverage); a floor is never lowered. Every point below 100%
# has a reason in the DV plan (#90).
# Measured 86.34% line (the existing 86 kept, 0.34 points of margin),
# 78.78% toggle. Functional 100 must hold every bin of mac_ltssm_arcs (all
# 64 arcs in each role), mac_os_tx, mac_os_rx, mac_frame and mac_control;
# a renamed or undeclared covergroup leaves the total, so keep this list.
coverage_floors: {line: 86, toggle: 78.2, functional: 100}
