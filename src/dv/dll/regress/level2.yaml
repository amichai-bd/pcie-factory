tests:
  - name: link_up_stress_sweep
    module: tests.test_dll
    testcase: link_up_stress
    top: pcie_dll_tb
    seeds: 8
    timeout_s: 600
  - name: link_up_stress_smallest
    module: tests.test_dll
    testcase: link_up_stress
    top: pcie_dll_tb
    seeds: 4
    timeout_s: 600
    params: {FC_PH: 1, FC_PD: 8, FC_NPH: 1, FC_NPD: 2, FC_CPLH: 1, FC_CPLD: 8}
  - name: tlp_partner_errors_sweep
    module: tests.test_dll_tlp_tx
    testcase: tlp_partner_errors
    top: pcie_dll_tb
    seeds: 8
    timeout_s: 600
  - name: seq_wrap
    module: tests.test_dll_tlp_tx
    testcase: seq_wrap
    top: pcie_dll_tb
    seeds: 2
    timeout_s: 900
  - name: rx_errors_sweep
    module: tests.test_dll_rx
    testcase: rx_errors
    top: pcie_dll_tb
    seeds: 8
    timeout_s: 600
  - name: rx_stall_smallest
    module: tests.test_dll_rx
    testcase: rx_stall
    top: pcie_dll_tb
    seeds: 4
    timeout_s: 600
    params: {FC_PH: 1, FC_PD: 8, FC_NPH: 1, FC_NPD: 2, FC_CPLH: 1, FC_CPLD: 8}
  # Error injection at the smallest credits: the smallest receive buffer's
  # rewind (bad and duplicate TLPs discarded).
  - name: rx_errors_smallest
    module: tests.test_dll_rx
    testcase: rx_errors_gated
    top: pcie_dll_tb
    seeds: 2
    timeout_s: 600
    params: {FC_PH: 1, FC_PD: 8, FC_NPH: 1, FC_NPD: 2, FC_CPLH: 1, FC_CPLD: 8}
  - name: rx_seq_wrap
    module: tests.test_dll_rx
    testcase: rx_seq_wrap
    top: pcie_dll_tb
    seeds: 1
    timeout_s: 1200
# Floors on the merged levels 0 to 2 (the nightly run), at the merged value
# less 0.5 points rounded down to a tenth (DV BKM, floor margin): measured
# 98.95% line (472/477), 80.53% toggle (13566/16846); every point not hit
# has a reason in the DV plan (Coverage holes). Functional 100 must hold
# every bin of dll_acknak_rx, dll_acknak_tx, dll_dl_states, dll_dllp_rx,
# dll_dllp_tx, dll_fc_init, dll_fc_rx, dll_fc_tx, dll_malformed, dll_rbuf,
# dll_replay, dll_reset, dll_rx_stream, dll_tlp_rx, dll_tlp_tx, dll_tx_tail
# and dll_updatefc_tx; a renamed or undeclared covergroup leaves the total,
# so keep this list.
coverage_floors: {line: 98.4, toggle: 80.0, functional: 100}
