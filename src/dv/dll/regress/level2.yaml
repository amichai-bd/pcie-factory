tests:
  - name: link_up_stress_sweep
    module: tests.test_dll
    testcase: link_up_stress
    top: pcie_dll_tb
    seeds: 8
    timeout_s: 600
  - name: link_up_stress_smallest
    module: tests.test_dll
    testcase: link_up_stress
    top: pcie_dll_tb
    seeds: 4
    timeout_s: 600
    coverage_seeds: 2
    params: {FC_PH: 1, FC_PD: 8, FC_NPH: 1, FC_NPD: 2, FC_CPLH: 1, FC_CPLD: 8}
  # Its 8 derived seeds pinned, then seeds 1 and 2 from level 1 (#389).
  - name: tlp_partner_errors_sweep
    module: tests.test_dll_tlp_tx
    testcase: tlp_partner_errors
    top: pcie_dll_tb
    seeds: [1769055356, 511087850, 125814096, 1886975430, 1847353445, 421220595,
            1179977, 1997877727, 1, 2]
    timeout_s: 600
  - name: seq_wrap
    module: tests.test_dll_tlp_tx
    testcase: seq_wrap
    top: pcie_dll_tb
    seeds: 2
    timeout_s: 900
  # Its 8 derived seeds pinned, then seeds 1 and 2 from level 1 (#389);
  # coverage on the first 6, as before.
  - name: rx_errors_sweep
    module: tests.test_dll_rx
    testcase: rx_errors
    top: pcie_dll_tb
    seeds: [1329335001, 943405647, 556952565, 1446337379, 1213320896, 1062665814,
            643805164, 1364762490, 1, 2]
    timeout_s: 600
    coverage_seeds: 6
  - name: rx_stall_smallest
    module: tests.test_dll_rx
    testcase: rx_stall
    top: pcie_dll_tb
    seeds: 4
    timeout_s: 600
    params: {FC_PH: 1, FC_PD: 8, FC_NPH: 1, FC_NPD: 2, FC_CPLH: 1, FC_CPLD: 8}
  # Error injection at the smallest credits: the smallest receive buffer's
  # rewind (bad and duplicate TLPs discarded).
  - name: rx_errors_smallest
    module: tests.test_dll_rx
    testcase: rx_errors_gated
    top: pcie_dll_tb
    seeds: 2
    timeout_s: 600
    params: {FC_PH: 1, FC_PD: 8, FC_NPH: 1, FC_NPD: 2, FC_CPLH: 1, FC_CPLD: 8}
  # Receive buffer sizing for digests (#308): H + D = 118 credits, so 4
  # DWs per header credit gives 512 words and 5 gives 1024; the fill stores
  # 533 DWs while the upper layer stalls.
  - name: rx_stall_digest
    module: tests.test_dll_rx
    testcase: rx_stall_digest
    top: pcie_dll_tb
    seeds: 1
    timeout_s: 300
    params: {FC_PH: 60, FC_PD: 46, FC_NPH: 1, FC_NPD: 2, FC_CPLH: 1, FC_CPLD: 8}
  - name: rx_seq_wrap
    module: tests.test_dll_rx
    testcase: rx_seq_wrap
    top: pcie_dll_tb
    seeds: 1
    timeout_s: 1200
  # Late releases at the smallest credits, every class finite: the
  # receive stream stalls too, and the release port sets the pace.
  - name: credit_release_smallest
    module: tests.test_dll_fc
    testcase: credit_release
    top: pcie_dll_tb
    seeds: 2
    timeout_s: 900
    params: {FC_PH: 1, FC_PD: 8, FC_NPH: 1, FC_NPD: 2, FC_CPLH: 1, FC_CPLD: 8, FC_RELEASE: 1}
  # The FC_RELEASE 1 build's transmit gate (its own credit block
  # specialization): the gate directed cases with releases running.
  - name: fc_tx_gate_release
    module: tests.test_dll_fc
    testcase: fc_tx_gate
    top: pcie_dll_tb
    seeds: [0]
    timeout_s: 300
    params: {FC_RELEASE: 1}
  # Error injection with FC_RELEASE 1: bad, duplicate and nullified TLPs
  # are never delivered, so never released; the delivered ones are. Seed 1
  # alone reaches Length bit 9 (DV plan), so coverage on both.
  - name: rx_errors_release
    module: tests.test_dll_rx
    testcase: rx_errors
    top: pcie_dll_tb
    seeds: [0, 1]
    timeout_s: 600
    coverage_seeds: 2
    params: {FC_RELEASE: 1}
  - name: mwr_max
    module: tests.test_dll_tlp_tx
    testcase: mwr_max
    top: pcie_dll_tb
    timeout_s: 300
  - name: ack_spec_max
    module: tests.test_dll_tlp_tx
    testcase: ack_spec_max
    top: pcie_dll_tb
    timeout_s: 300
  # The further seeds of level 1's seeded entries, moved here unchanged
  # with their coverage instrumentation (#389; DV plan, Level placement):
  # level 1 runs each entry's first seed.
  - name: fc_rx_accounting_finite_sweep
    module: tests.test_dll_fc
    testcase: fc_rx_accounting
    top: pcie_dll_tb
    seeds: [1892473378]
    timeout_s: 300
    params: {FC_PH: 6, FC_PD: 40, FC_NPH: 4, FC_NPD: 2, FC_CPLH: 16, FC_CPLD: 64}
  - name: fc_rx_accounting_infinite_sweep
    module: tests.test_dll_fc
    testcase: fc_rx_accounting
    top: pcie_dll_tb
    seeds: [1163266549]
    timeout_s: 300
    coverage_seeds: 0
    params: {FC_PH: 0, FC_PD: 0, FC_NPH: 0, FC_NPD: 0, FC_CPLH: 0, FC_CPLD: 0}
  - name: credit_starve_sweep
    module: tests.test_dll_fc
    testcase: credit_starve
    top: pcie_dll_tb
    seeds: [1, 2, 3]
    timeout_s: 600
    coverage_seeds: 2
  - name: credits_infinite_sweep
    module: tests.test_dll_fc
    testcase: credits_infinite
    top: pcie_dll_tb
    seeds: [1229063237]
    timeout_s: 300
    coverage_seeds: 0
    params: {FC_PH: 0, FC_PD: 0, FC_NPH: 0, FC_NPD: 0, FC_CPLH: 0, FC_CPLD: 0}
  - name: tlp_partner_sweep
    module: tests.test_dll_tlp_tx
    testcase: tlp_partner
    top: pcie_dll_tb
    seeds: [1]
    timeout_s: 300
    coverage_seeds: 0
  - name: tlp_rollover_sweep
    module: tests.test_dll_tlp_tx
    testcase: tlp_rollover
    top: pcie_dll_tb
    seeds: [1]
    timeout_s: 300
    coverage_seeds: 0
  - name: rx_traffic_sweep
    module: tests.test_dll_rx
    testcase: rx_traffic
    top: pcie_dll_tb
    seeds: [1]
    timeout_s: 300
    coverage_seeds: 0
  - name: credit_starve_rx_sweep
    module: tests.test_dll_fc
    testcase: credit_starve_rx
    top: pcie_dll_tb
    seeds: [1229081417]
    timeout_s: 600
    params: {FC_PH: 8, FC_PD: 32, FC_NPH: 8, FC_NPD: 8, FC_CPLH: 8, FC_CPLD: 32}
  - name: credits_infinite_rx_sweep
    module: tests.test_dll_fc
    testcase: credits_infinite_rx
    top: pcie_dll_tb
    seeds: [1951378203]
    timeout_s: 600
    params: {FC_PH: 0, FC_PD: 0, FC_NPH: 0, FC_NPD: 0, FC_CPLH: 0, FC_CPLD: 0}
  - name: credit_release_sweep
    module: tests.test_dll_fc
    testcase: credit_release
    top: pcie_dll_tb
    seeds: [1]
    timeout_s: 600
    params: {FC_RELEASE: 1}
  - name: tlp_bidir_sweep
    module: tests.test_dll_tlp_tx
    testcase: tlp_bidir
    top: pcie_dll_tb
    seeds: [1]
    timeout_s: 300
  # The REPLAY_TIMEOUT 1400 build (#384), its own pcie_dll and transmit
  # block specialization, which replay_timeout_slow alone barely reaches
  # (#401): errors and replays, the rollover target, both directions
  # loaded, and a link-down mid-TLP (the flush of the wider timer).
  - name: tlp_partner_errors_slow
    module: tests.test_dll_tlp_tx
    testcase: tlp_partner_errors
    top: pcie_dll_tb
    seeds: [0]
    timeout_s: 600
    params: {REPLAY_TIMEOUT: 1400}
  - name: tlp_rollover_slow
    module: tests.test_dll_tlp_tx
    testcase: tlp_rollover
    top: pcie_dll_tb
    seeds: [0]
    timeout_s: 600
    params: {REPLAY_TIMEOUT: 1400}
  - name: tlp_bidir_slow
    module: tests.test_dll_tlp_tx
    testcase: tlp_bidir
    top: pcie_dll_tb
    seeds: [0]
    timeout_s: 600
    params: {REPLAY_TIMEOUT: 1400}
  - name: link_down_mid_tlp_slow
    module: tests.test_dll_tlp_tx
    testcase: link_down_mid_tlp
    top: pcie_dll_tb
    timeout_s: 300
    params: {REPLAY_TIMEOUT: 1400}
# Floors on the merged levels 0 to 2 (the nightly run), at the merged value
# less 0.5 points rounded down to a tenth (DV BKM, floor margin): line 98.5
# from 99.07% (637/643) and toggle 77.0 from 77.57% (19987/25768), both
# raised by #401 once the REPLAY_TIMEOUT 1400 entries above reached that
# build's copies; toggle was lowered from 80.0 by captain decision on #354
# for the FC_RELEASE parameter copies and tie-off (DV plan, Coverage
# holes); every point not hit has a reason in the DV plan (Coverage holes).
# Functional 100 must hold every bin of dll_acknak_rx, dll_acknak_tx,
# dll_digest, dll_dl_states, dll_dllp_rx, dll_dllp_tx, dll_fc_init,
# dll_fc_rx, dll_fc_tx, dll_malformed, dll_rbuf, dll_replay, dll_reset,
# dll_rx_stream, dll_tlp_rx, dll_tlp_tx, dll_tx_tail and dll_updatefc_tx; a
# renamed or undeclared covergroup leaves the total, so keep this list.
coverage_floors: {line: 98.5, toggle: 77.0, functional: 100}
