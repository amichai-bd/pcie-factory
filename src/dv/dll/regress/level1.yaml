tests:
  - name: updatefc_refresh
    module: tests.test_dll
    testcase: updatefc_refresh
    top: pcie_dll_tb
    seeds: 2
    timeout_s: 120
  # The test seed picks the partner's credits (one of four, test seed mod
  # 4); four consecutive seeds give all four.
  - name: link_up
    module: tests.test_dll
    testcase: link_up
    top: pcie_dll_tb
    seeds: [0, 1, 2, 3]
    timeout_s: 300
  - name: link_up_cpl_finite
    module: tests.test_dll
    testcase: link_up
    top: pcie_dll_tb
    seeds: [0, 1, 2, 3]
    timeout_s: 300
    coverage_seeds: 4
    params: {FC_CPLH: 16, FC_CPLD: 64}
  - name: link_up_infinite
    module: tests.test_dll
    testcase: link_up
    top: pcie_dll_tb
    seeds: [0, 1, 2, 3]
    timeout_s: 300
    coverage_seeds: 4
    params: {FC_PH: 0, FC_PD: 0, FC_NPH: 0, FC_NPD: 0, FC_CPLH: 0, FC_CPLD: 0}
  - name: link_up_stress
    module: tests.test_dll
    testcase: link_up_stress
    top: pcie_dll_tb
    seeds: [0, 1]
    timeout_s: 300
  # Level 1, not 0 (#325): about 13 s of CPU, a functional gate test rather
  # than a fast build check (DV_PLAN, Level placement).
  - name: fc_tx_gate
    module: tests.test_dll_fc
    testcase: fc_tx_gate
    top: pcie_dll_tb
    timeout_s: 300
  - name: fc_rx_accounting_finite
    module: tests.test_dll_fc
    testcase: fc_rx_accounting
    top: pcie_dll_tb
    seeds: 2
    timeout_s: 300
    coverage_seeds: 2
    params: {FC_PH: 6, FC_PD: 40, FC_NPH: 4, FC_NPD: 2, FC_CPLH: 16, FC_CPLD: 64}
  - name: fc_rx_accounting_infinite
    module: tests.test_dll_fc
    testcase: fc_rx_accounting
    top: pcie_dll_tb
    seeds: 2
    timeout_s: 300
    params: {FC_PH: 0, FC_PD: 0, FC_NPH: 0, FC_NPD: 0, FC_CPLH: 0, FC_CPLD: 0}
  # The test seed picks the partner's credits (one of four, test seed mod
  # 4): three with every class finite, one with completions infinite.
  - name: credit_starve
    module: tests.test_dll_fc
    testcase: credit_starve
    top: pcie_dll_tb
    seeds: [0, 1, 2, 3]
    timeout_s: 600
    coverage_seeds: 3
  - name: credits_infinite
    module: tests.test_dll_fc
    testcase: credits_infinite
    top: pcie_dll_tb
    seeds: 2
    timeout_s: 300
    params: {FC_PH: 0, FC_PD: 0, FC_NPH: 0, FC_NPD: 0, FC_CPLH: 0, FC_CPLD: 0}
  - name: tlp_partner
    module: tests.test_dll_tlp_tx
    testcase: tlp_partner
    top: pcie_dll_tb
    seeds: [0, 1]
    timeout_s: 300
  - name: tlp_partner_errors
    module: tests.test_dll_tlp_tx
    testcase: tlp_partner_errors
    top: pcie_dll_tb
    seeds: [0, 1, 2]
    timeout_s: 300
  - name: tlp_rollover
    module: tests.test_dll_tlp_tx
    testcase: tlp_rollover
    top: pcie_dll_tb
    seeds: [0, 1]
    timeout_s: 300
  - name: rx_traffic
    module: tests.test_dll_rx
    testcase: rx_traffic
    top: pcie_dll_tb
    seeds: [0, 1]
    timeout_s: 300
  - name: rx_errors
    module: tests.test_dll_rx
    testcase: rx_errors
    top: pcie_dll_tb
    seeds: [0, 1, 2]
    timeout_s: 300
  - name: rx_errors_infinite
    module: tests.test_dll_rx
    testcase: rx_errors
    top: pcie_dll_tb
    seeds: [0]
    timeout_s: 300
    params: {FC_PH: 0, FC_PD: 0, FC_NPH: 0, FC_NPD: 0, FC_CPLH: 0, FC_CPLD: 0}
  - name: rx_stall
    module: tests.test_dll_rx
    testcase: rx_stall
    top: pcie_dll_tb
    seeds: [0, 1]
    timeout_s: 300
    coverage_seeds: 2
    params: {FC_CPLH: 16, FC_CPLD: 64}
  - name: credit_starve_rx
    module: tests.test_dll_fc
    testcase: credit_starve_rx
    top: pcie_dll_tb
    seeds: 2
    timeout_s: 600
    coverage_seeds: 2
    params: {FC_PH: 8, FC_PD: 32, FC_NPH: 8, FC_NPD: 8, FC_CPLH: 8, FC_CPLD: 32}
  - name: credits_infinite_rx
    module: tests.test_dll_fc
    testcase: credits_infinite_rx
    top: pcie_dll_tb
    seeds: 2
    timeout_s: 600
    coverage_seeds: 2
    params: {FC_PH: 0, FC_PD: 0, FC_NPH: 0, FC_NPD: 0, FC_CPLH: 0, FC_CPLD: 0}
  # FC_RELEASE 1 (HAS, credit release): default credits (completions
  # infinite, so the stream never stalls) with late releases; receive
  # accounting with releases, NP data infinite (an infinite field in a
  # released class).
  - name: credit_release
    module: tests.test_dll_fc
    testcase: credit_release
    top: pcie_dll_tb
    seeds: [0, 1]
    timeout_s: 600
    coverage_seeds: 2
    params: {FC_RELEASE: 1}
  - name: fc_rx_accounting_release
    module: tests.test_dll_fc
    testcase: fc_rx_accounting
    top: pcie_dll_tb
    seeds: 1
    timeout_s: 300
    params: {FC_PH: 6, FC_PD: 40, FC_NPH: 4, FC_NPD: 0, FC_CPLH: 16, FC_CPLD: 64, FC_RELEASE: 1}
  - name: tlp_bidir
    module: tests.test_dll_tlp_tx
    testcase: tlp_bidir
    top: pcie_dll_tb
    seeds: [0, 1]
    timeout_s: 300
    coverage_seeds: 2
