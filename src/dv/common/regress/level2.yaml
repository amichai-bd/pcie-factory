    seeds: 4
    timeout_s: 600
  - name: fifo_long_depth16
    module: tests.test_cdc_fifo
    testcase: long_traffic
    top: common_cdc_fifo
    params: {ADDR_W: 4, WIDTH: 16}
    seeds: 4
    timeout_s: 600
  - name: rst_long
    module: tests.test_cdc_rst
