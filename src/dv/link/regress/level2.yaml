# Long tests and seed sweeps (new seeds: derived from each entry's name).
tests:
  - name: e2e_disable
    module: tests.test_link_e2e
    testcase: e2e_disable
    top: pcie_link_e2e_tb
    timeout_s: 900
  - name: e2e_loopback
    module: tests.test_link_e2e
    testcase: e2e_loopback
    top: pcie_link_e2e_tb
    timeout_s: 900
  - name: e2e_soak_default
    module: tests.test_link_e2e
    testcase: e2e_soak
    top: pcie_link_e2e_tb
    seeds: 3
    timeout_s: 1800
  - name: e2e_soak_minimum
    module: tests.test_link_e2e
    testcase: e2e_soak
    top: pcie_link_e2e_tb
    params: {CREDITS: 1}
    seeds: 3
    timeout_s: 1800
  - name: e2e_soak_finite
    module: tests.test_link_e2e
    testcase: e2e_soak
    top: pcie_link_e2e_tb
    params: {CREDITS: 2}
    seeds: 2
    timeout_s: 1800
  - name: e2e_soak_infinite
    module: tests.test_link_e2e
    testcase: e2e_soak
    top: pcie_link_e2e_tb
    params: {CREDITS: 3}
    seeds: 2
    timeout_s: 1800
  - name: e2e_soak_asymmetric
    module: tests.test_link_e2e
    testcase: e2e_soak
    top: pcie_link_e2e_tb
    params: {CREDITS: 4}
    seeds: 2
    timeout_s: 1800
  - name: e2e_tlp_errors_sweep
    module: tests.test_link_e2e
    testcase: e2e_tlp_errors
    top: pcie_link_e2e_tb
    seeds: 2
    timeout_s: 900
  - name: e2e_dllp_errors_sweep
    module: tests.test_link_e2e
    testcase: e2e_dllp_errors
    top: pcie_link_e2e_tb
    seeds: 2
    timeout_s: 900
  - name: e2e_rollover_sweep
    module: tests.test_link_e2e
    testcase: e2e_rollover
    top: pcie_link_e2e_tb
    seeds: 2
    timeout_s: 900
  - name: e2e_line_sweep
    module: tests.test_link_e2e
    testcase: e2e_line
    top: pcie_link_e2e_tb
    seeds: 3
    timeout_s: 900
  - name: e2e_mixed_sweep
    module: tests.test_link_e2e
    testcase: e2e_mixed
    top: pcie_link_e2e_tb
    seeds: 4
    timeout_s: 900
# The HAS throughput measurement (2000 TLPs per direction, 0 ppm), swept
# over seeds: each seed draws the start against the SKP schedule and, both
# ways, b's start against a's, so the items line up differently.
  - name: e2e_throughput_oneway
    module: tests.test_link_e2e
    testcase: e2e_throughput_oneway
    top: pcie_link_e2e_tb
    seeds: 3
    timeout_s: 1800
  - name: e2e_throughput_bidir
    module: tests.test_link_e2e
    testcase: e2e_throughput_bidir
    top: pcie_link_e2e_tb
    seeds: 3
    timeout_s: 1800
