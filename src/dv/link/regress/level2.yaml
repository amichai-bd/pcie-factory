# Long tests and seed sweeps (new seeds: derived from each entry's name).
tests:
  - name: e2e_disable
    module: tests.test_link_e2e
    testcase: e2e_disable
    top: pcie_link_e2e_tb
    timeout_s: 900
  - name: e2e_loopback
    module: tests.test_link_e2e
    testcase: e2e_loopback
    top: pcie_link_e2e_tb
    timeout_s: 900
  - name: e2e_soak_default
    module: tests.test_link_e2e
    testcase: e2e_soak
    top: pcie_link_e2e_tb
    seeds: 3
    timeout_s: 1800
    coverage_seeds: 2
  - name: e2e_soak_minimum
    module: tests.test_link_e2e
    testcase: e2e_soak
    top: pcie_link_e2e_tb
    params: {CREDITS: 1}
    seeds: 2
    timeout_s: 1800
    coverage_seeds: 2
  - name: e2e_soak_finite
    module: tests.test_link_e2e
    testcase: e2e_soak
    top: pcie_link_e2e_tb
    params: {CREDITS: 2}
    seeds: [2116043723, 219244450, 74]   # derived seed 0; 219244450 and 74 pinned (#359)
    timeout_s: 1800
  - name: e2e_soak_infinite
    module: tests.test_link_e2e
    testcase: e2e_soak
    top: pcie_link_e2e_tb
    params: {CREDITS: 3}
    seeds: 1
    timeout_s: 1800
  - name: e2e_soak_asymmetric
    module: tests.test_link_e2e
    testcase: e2e_soak
    top: pcie_link_e2e_tb
    params: {CREDITS: 4}
    seeds: 2
    timeout_s: 1800
    coverage_seeds: 2
  - name: e2e_soak_release
    module: tests.test_link_e2e
    testcase: e2e_soak
    top: pcie_link_e2e_tb
    params: {CREDITS: 5}
    seeds: 1
    timeout_s: 1800
  # The soak on the REPLAY_TIMEOUT 1400 build of e2e_replay_timeout (L1),
  # for that build's own parameter-set copies of pcie_link, pcie_dll and
  # its transmit block (#416; DV plan, Coverage holes).
  - name: e2e_soak_replay_timeout
    module: tests.test_link_e2e
    testcase: e2e_soak
    top: pcie_link_e2e_tb
    params: {REPLAY_TIMEOUT: 1400}
    seeds: 1
    timeout_s: 1800
  - name: e2e_tlp_errors_sweep
    module: tests.test_link_e2e
    testcase: e2e_tlp_errors
    top: pcie_link_e2e_tb
    seeds: 2
    timeout_s: 900
  - name: e2e_dllp_errors_sweep
    module: tests.test_link_e2e
    testcase: e2e_dllp_errors
    top: pcie_link_e2e_tb
    seeds: 2
    timeout_s: 900
  - name: e2e_rollover_sweep
    module: tests.test_link_e2e
    testcase: e2e_rollover
    top: pcie_link_e2e_tb
    seeds: 2
    timeout_s: 900
    coverage_seeds: 2
  - name: e2e_line_sweep
    module: tests.test_link_e2e
    testcase: e2e_line
    top: pcie_link_e2e_tb
    seeds: 3
    timeout_s: 900
    coverage_seeds: 2
  # The four derived seeds in index order (the first is the coverage
  # seed), then 1733523445 (#429): an UpdateFC-NP dropped as the traffic
  # drains, so the credits return only with the refresh.
  - name: e2e_mixed_sweep
    module: tests.test_link_e2e
    testcase: e2e_mixed
    top: pcie_link_e2e_tb
    seeds: [1923595350, 94407872, 480894330, 1806626284, 1733523445]
    timeout_s: 900
# Directed entries moved from level 1 to keep ci-gate inside its budget
# (#272); level 1 keeps the error classes, the rollover, the minimum
# credits and the throughput screen.
  # Derived seed 0, then 1272327024 (#468): a new TLP cut before its
  # sequence number as the sender leaves L0, then the next new one.
  - name: e2e_line
    module: tests.test_link_e2e
    testcase: e2e_line
    top: pcie_link_e2e_tb
    seeds: [312295211, 1272327024]
    timeout_s: 600
  - name: e2e_mixed
    module: tests.test_link_e2e
    testcase: e2e_mixed
    top: pcie_link_e2e_tb
    timeout_s: 600
  - name: e2e_hot_reset
    module: tests.test_link_e2e
    testcase: e2e_hot_reset
    top: pcie_link_e2e_tb
    timeout_s: 600
  - name: e2e_hot_reset_release
    module: tests.test_link_e2e
    testcase: e2e_hot_reset
    top: pcie_link_e2e_tb
    params: {CREDITS: 5}
    timeout_s: 600
  - name: e2e_credits_finite
    module: tests.test_link_e2e
    testcase: e2e_credits
    top: pcie_link_e2e_tb
    params: {CREDITS: 2}
    timeout_s: 600
  - name: e2e_credits_infinite
    module: tests.test_link_e2e
    testcase: e2e_credits
    top: pcie_link_e2e_tb
    params: {CREDITS: 3}
    timeout_s: 600
  - name: e2e_credits_asymmetric
    module: tests.test_link_e2e
    testcase: e2e_credits
    top: pcie_link_e2e_tb
    params: {CREDITS: 4}
    timeout_s: 600
# The HAS throughput measurement (2000 TLPs per direction, 0 ppm). Each
# seed draws the start against the SKP schedule and, both ways, b's start
# against a's, so the items line up differently. One way runs one seed: the
# three seeds of #299 all measured 0.85645 (#272); both ways keeps three.
  - name: e2e_throughput_oneway
    module: tests.test_link_e2e
    testcase: e2e_throughput_oneway
    top: pcie_link_e2e_tb
    timeout_s: 1800
  - name: e2e_throughput_bidir
    module: tests.test_link_e2e
    testcase: e2e_throughput_bidir
    top: pcie_link_e2e_tb
    seeds: 2
    timeout_s: 1800
# The GPIO lower layer (#378): sustained maximum-payload load both ways at
# the clock ratios 1/2, 1 and 2 of the gpio clock contract (no replay
# timeout: the replay timeout's sizing, link HAS), and Hot Reset. No coverage
# runs (level1.yaml).
  - name: gpio_load_equal
    module: tests.test_link_gpio
    testcase: gpio_load
    top: pcie_link_gpio_tb
    timeout_s: 1200
    coverage_seeds: 0
  - name: gpio_load_half
    module: tests.test_link_gpio
    testcase: gpio_load
    top: pcie_link_gpio_tb
    params: {RATIO: 0}
    timeout_s: 1200
    coverage_seeds: 0
  - name: gpio_load_double
    module: tests.test_link_gpio
    testcase: gpio_load
    top: pcie_link_gpio_tb
    params: {RATIO: 2}
    timeout_s: 1200
    coverage_seeds: 0
  - name: gpio_hot_reset
    module: tests.test_link_gpio
    testcase: gpio_hot_reset
    top: pcie_link_gpio_tb
    timeout_s: 600
    coverage_seeds: 0
# Floors on the merged levels 0 to 2 (the nightly run), by source (#228):
# the merged value less 0.5 points rounded down to a tenth, never below
# the existing floor (DV BKM, floor margin), except as stated. Line 89.6
# from 90.13% (1260/1398), lowered from 90.7 by captain decision on #228
# (https://github.com/amichai-bd/pcie-factory/issues/228#issuecomment-6394848631):
# counting each source line once, not once per parameter copy, lowers the
# percentage although no reachable line loses coverage. Toggle 82.8 from
# 83.34% (16312/19572). The earlier per-instance floors (#360, re-measured
# for #416; toggle lowered by captain decision on #360) are in the DV plan
# (Coverage holes), where every point not hit has a reason. An entry with
# a new parameter set (a new CREDITS, REPLAY_TIMEOUT or other value)
# re-measures these floors in the same PR.
# Functional 100 must hold every bin of link_e2e_config, link_e2e_control,
# link_e2e_credit, link_e2e_inject, link_e2e_recovery and link_e2e_traffic;
# a renamed or undeclared covergroup leaves the total, so keep this list.
coverage_floors: {line: 89.6, toggle: 82.8, functional: 100}
