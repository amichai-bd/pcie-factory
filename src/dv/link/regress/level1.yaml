# Default credits (CREDITS 0) unless an entry sets CREDITS: the error
# classes and the rollover on the HAS default configuration, the minimum
# credits (tb/pcie_link_e2e_tb.sv) and the throughput screen. The other
# directed entries run in level 2 (#272).
tests:
  - name: e2e_tlp_errors
    module: tests.test_link_e2e
    testcase: e2e_tlp_errors
    top: pcie_link_e2e_tb
    timeout_s: 600
  - name: e2e_dllp_errors
    module: tests.test_link_e2e
    testcase: e2e_dllp_errors
    top: pcie_link_e2e_tb
    timeout_s: 600
  # A running-disparity-only error each way (#436): the phy's pkt_rx_err
  # through link to the dll.
  - name: e2e_disparity
    module: tests.test_link_e2e
    testcase: e2e_disparity
    top: pcie_link_e2e_tb
    timeout_s: 600
  - name: e2e_rollover
    module: tests.test_link_e2e
    testcase: e2e_rollover
    top: pcie_link_e2e_tb
    timeout_s: 600
  - name: e2e_credits_minimum
    module: tests.test_link_e2e
    testcase: e2e_credits
    top: pcie_link_e2e_tb
    params: {CREDITS: 1}
    timeout_s: 600
  # The dll credit-release port through link (CREDITS 5): default
  # credits, late releases at both ends.
  - name: e2e_credits_release
    module: tests.test_link_e2e
    testcase: e2e_credits
    top: pcie_link_e2e_tb
    params: {CREDITS: 5}
    timeout_s: 600
  - name: e2e_throughput_short
    module: tests.test_link_e2e
    testcase: e2e_throughput_short
    top: pcie_link_e2e_tb
    timeout_s: 600
  # REPLAY_TIMEOUT through link (#384), at 1400: a raised value (the GPIO
  # build now runs at 3214, link HAS replay timeout at LOWER 1).
  - name: e2e_replay_timeout
    module: tests.test_link_e2e
    testcase: e2e_replay_timeout
    top: pcie_link_e2e_tb
    params: {REPLAY_TIMEOUT: 1400}
    timeout_s: 600
  # The GPIO lower layer (LOWER 1, #378) on its own top: the dll over the
  # adapter, error-free with gpio_smoke's Hot Reset step (the link idle; its
  # in-flight case is gpio_hot_reset in level 2), and one and two damaged
  # slots. No coverage runs:
  # the adapter's coverage is the gpio unit's (#380), and the link floors
  # stay measured on the phy stack.
  - name: gpio_smoke
    module: tests.test_link_gpio
    testcase: gpio_smoke
    top: pcie_link_gpio_tb
    timeout_s: 600
    coverage_seeds: 0
  - name: gpio_damage
    module: tests.test_link_gpio
    testcase: gpio_damage
    top: pcie_link_gpio_tb
    timeout_s: 600
    coverage_seeds: 0
