tests:
  - name: rx_routing
    module: tests.test_tl_rx
    testcase: rx_routing
    top: pcie_tl_tb
    timeout_s: 300
  - name: rx_order
    module: tests.test_tl_rx
    testcase: rx_order
    top: pcie_tl_tb
    timeout_s: 300
  - name: rx_link_down
    module: tests.test_tl_rx
    testcase: rx_link_down
    top: pcie_tl_tb
    timeout_s: 300
  - name: rx_random
    module: tests.test_tl_rx
    testcase: rx_random
    top: pcie_tl_tb
    timeout_s: 300
  # The smallest queues: every posted and non-posted queue fills, the host
  # waits on releases.
  - name: rx_random_min_credits
    module: tests.test_tl_rx
    testcase: rx_random
    top: pcie_tl_tb
    timeout_s: 300
    params: {FC_PH: 1, FC_PD: 8, FC_NPH: 1, FC_NPD: 2}
  # Non-posted data credits above 8, so the release carries owed data.
  - name: rx_np_collide
    module: tests.test_tl_rx
    testcase: rx_np_collide
    top: pcie_tl_tb
    timeout_s: 300
    params: {FC_NPD: 16}
  # The epoch counters past their wrap: the only entry that reaches it.
  - name: rx_epoch_wrap
    module: tests.test_tl_rx
    testcase: rx_epoch_wrap
    top: pcie_tl_tb
    timeout_s: 300
  - name: tx_completions
    module: tests.test_tl_tx
    testcase: tx_completions
    top: pcie_tl_tb
    timeout_s: 300
  - name: tx_requests
    module: tests.test_tl_tx
    testcase: tx_requests
    top: pcie_tl_tb
    timeout_s: 300
  - name: tx_random
    module: tests.test_tl_tx
    testcase: tx_random
    top: pcie_tl_tb
    timeout_s: 300
  - name: tx_credits
    module: tests.test_tl_tx
    testcase: tx_credits
    top: pcie_tl_tb
    timeout_s: 300
  - name: cpl_matching
    module: tests.test_tl_cpl
    testcase: cpl_matching
    top: pcie_tl_tb
    timeout_s: 300
  - name: cpl_tags
    module: tests.test_tl_cpl
    testcase: cpl_tags
    top: pcie_tl_tb
    timeout_s: 300
  # CPL_TIMEOUT_DIV 1024 (the testbench default): timeouts after 2048 to 2176 cycles.
  - name: cpl_timeout
    module: tests.test_tl_cpl
    testcase: cpl_timeout
    top: pcie_tl_tb
    timeout_s: 300
  - name: cpl_random
    module: tests.test_tl_cpl
    testcase: cpl_random
    top: pcie_tl_tb
    timeout_s: 300
