tests:
  - name: rx_random_long
    module: tests.test_tl_rx
    testcase: rx_random_long
    top: pcie_tl_tb
    seeds: 4
    timeout_s: 900
  # A larger BAR0 and odd credit sizes.
  - name: rx_random_long_params
    module: tests.test_tl_rx
    testcase: rx_random_long
    top: pcie_tl_tb
    seeds: 2
    timeout_s: 900
    params: {FC_PH: 3, FC_PD: 20, FC_NPH: 5, FC_NPD: 3, BAR0_ADDR_W: 20}
  - name: tx_random_long
    module: tests.test_tl_tx
    testcase: tx_random_long
    top: pcie_tl_tb
    seeds: 4
    timeout_s: 900
  - name: cpl_random_long
    module: tests.test_tl_cpl
    testcase: cpl_random_long
    top: pcie_tl_tb
    seeds: 3
    timeout_s: 900
# Floors on the merged levels 0 to 2 (the nightly run), at the merged value
# less 0.5 points rounded down to a tenth (DV BKM, floor margin): measured
# 97.70% line (1019/1043), 78.27% toggle (41815/53424); every point not hit
# has a reason in the DV plan (Coverage holes). An entry with a new
# parameter set, or an RTL change that adds state, re-measures these floors
# in the same PR.
# Functional 100 must hold every bin of tl_cpl, tl_rx_order, tl_rx_outcome,
# tl_rx_slot_power and tl_tx; a renamed or undeclared covergroup leaves the
# total, so keep this list.
coverage_floors: {line: 97.1, toggle: 77.7, functional: 100}
