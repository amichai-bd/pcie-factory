    top: pcie_cfg_tb
    seeds: [1688380133]
    timeout_s: 300
# Floors on the merged levels 0 to 2 (the nightly run), by source (#228):
# the merged value less 0.5 points rounded down to a tenth, never below
# the existing floor (DV BKM, floor margin): 100.00% line (266/266) and
# 84.90% toggle (9954/11724). The per-instance figures behind the earlier
# floors are in the DV plan (Coverage holes), where every point not hit
# has a reason. An entry with a new parameter set re-measures these floors
# in the same PR.
# Functional 100 must hold every bin of cfg_access, cfg_err, cfg_irq,
# cfg_msg, cfg_power and cfg_slot_power; a renamed or undeclared covergroup
# leaves the total, so keep this list.
coverage_floors: {line: 99.5, toggle: 84.4, functional: 100}
