tests:
  - name: random_long
    module: tests.test_cfg_random
    testcase: random_long
    top: pcie_cfg_tb
    seeds: 4
    timeout_s: 600
  - name: random_long_64
    module: tests.test_cfg_random
    testcase: random_long
    top: pcie_cfg_tb
    seeds: 2
    timeout_s: 600
    params: {MSIX_TABLE_SIZE: 64, BAR0_ADDR_W: 28}
  - name: random_long_1
    module: tests.test_cfg_random
    testcase: random_long
    top: pcie_cfg_tb
    seeds: 2
    timeout_s: 600
    params: {MSIX_TABLE_SIZE: 1, BAR0_ADDR_W: 20}
  - name: enumeration_params_sweep
    module: tests.test_cfg
    testcase: enumeration
    top: pcie_cfg_tb
    seeds: [1585370101]
    coverage_seeds: 0
    timeout_s: 300
    params: {BAR0_ADDR_W: 20, MSIX_TABLE_SIZE: 1, VENDOR_ID: 0x1AF4, DEVICE_ID: 0x0001,
             CLASS_CODE: 0x058000, REVISION_ID: 0x01}
  - name: random_ops_sweep
    module: tests.test_cfg_random
    testcase: random_ops
    top: pcie_cfg_tb
    seeds: [1688380133]
    timeout_s: 300
# Floors on the merged levels 0 to 2 (the nightly run), at the merged value
# less 0.5 points rounded down to a tenth (DV BKM, floor margin): measured
# 97.92% line (1038/1060), 64.94% toggle (25020/38528); every point not hit
# has a reason in the DV plan (Coverage holes). An entry with a new
# parameter set re-measures these floors in the same PR.
# Functional 100 must hold every bin of cfg_access, cfg_err, cfg_irq,
# cfg_msg, cfg_power and cfg_slot_power; a renamed or undeclared covergroup
# leaves the total, so keep this list.
coverage_floors: {line: 99.5, toggle: 84.4, functional: 100}
