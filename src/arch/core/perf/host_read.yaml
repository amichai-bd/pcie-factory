# Host reads (wiki/src/arch/core/HAS.md#targets): 128-byte MRd from BAR0, the application answering
# in 16 cycles; completions >= 0.98 of the link both-ways payload rate and
# >= 0.745 of the line, each checked by the host stand-in.
description: 1000 host MRd of 128 bytes from BAR0, after enumeration.
seed: 1
workload:
  kind: traffic
  host: read
  tlps: 1000
targets:
  fraction_of_link: {min: 0.98}
  payload_line_fraction: {min: 0.745}
  completions_per_read: {min: 1, max: 1}
  completion_errors: {max: 0}
  host_reads_done: {min: 1000}
  tl_errors: {max: 0}
