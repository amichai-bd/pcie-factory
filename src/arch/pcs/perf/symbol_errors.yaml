# Isolated single-bit errors are all reported and never cost symbol lock (wiki/src/arch/pcs/HAS.md#targets).
description: Random traffic with ten single-bit errors, RX clock -300 ppm.
seed: 7
workload:
  kind: link
  packets: 600
  mix: random
  ppm: -300
  errors: 10
targets:
  eb_fill_symbols_min: {min: 2}
  eb_fill_symbols_max: {max: 14}
  eb_write_view_words_max: {max: 12}
  eb_overflows: {max: 0}
  eb_underflows: {max: 0}
  false_relocks: {max: 0}
  error_reports: {min: 10}
