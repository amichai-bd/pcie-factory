# Mixed traffic with the RX clock slow (wiki/src/arch/pcs/HAS.md#targets).
description: Random TLP sizes and DLLPs, shortest SKP interval, RX clock -600 ppm.
seed: 4
workload:
  kind: link
  packets: 600
  mix: random
  skp_interval: 1180
  ppm: -600
targets:
  eb_fill_symbols_min: {min: 4}
  eb_fill_symbols_max: {max: 12}
  eb_write_view_words_max: {max: 12}
  eb_overflows: {max: 0}
  eb_underflows: {max: 0}
  rx_latency_cycles_max: {max: 12}
  symbols_lost: {max: 0}
  skp_status_off_com: {max: 0}
  symbols_wrong: {max: 0}
  relocks: {max: 0}
  tx_run_length_max: {max: 5}
