# Half-rate source with periodic re-seeds: bubbles and re-seeds never stall
# the stream or add latency (wiki/src/arch/top/HAS.md#targets).
description: Random bytes offered in half the cycles, a re-seed every 128 bytes.
seed: 2
workload:
  bytes: 4096
  valid_ratio: 0.5
  reseed_every: 128
targets:
  throughput_ratio: {min: 1.0}
  latency_cycles_max: {max: 1}
