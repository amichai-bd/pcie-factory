# Host reads through BAR0 (wiki/src/arch/tl/HAS.md#targets): eight handles
# and the release rule keep the completion direction at the link rate.
description: 1000 host MRd of 128 bytes from BAR0, the application answering 16 cycles after each read.
seed: 1
workload:
  kind: completer
  op: read
  tlps: 1000
  app_latency: 16
targets:
  fraction_of_link: {min: 0.98}
  payload_line_fraction: {min: 0.759}
  completions_per_read: {min: 1, max: 1}
  completion_errors: {max: 0}
  handles_in_use_max: {max: 8}
  nonposted_header_credits_held_max: {max: 8}
  tl_errors: {max: 0}
