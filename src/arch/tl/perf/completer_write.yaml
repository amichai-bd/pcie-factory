# Host writes in through BAR0 (wiki/src/arch/tl/HAS.md#targets): tl adds no
# line bytes and its queue and credit release never limit the link.
description: 2000 host MWr of 128 bytes to BAR0 back to back, default credits, the application always ready.
seed: 1
workload:
  kind: completer
  op: write
  tlps: 2000
targets:
  fraction_of_link: {min: 0.98}
  payload_line_fraction: {min: 0.833}
  posted_header_credits_held_max: {max: 8}
  posted_data_credits_held_max: {max: 32}
  tl_errors: {max: 0}
